<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水理ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: a 3D editor shell — header across the top, tool strip at left, viewport centre, scene list + properties at right, transport along the bottom. */
:root {
  --bg: #16191c;
  --panel: #23272b;
  --panel-2: #2b3035;
  --field: #1b1f22;
  --line: #3a4046;
  --line-soft: #30353a;
  --text: #e4e8ea;
  --muted: #98a2a8;
  --accent: #f2a43a;
  --accent-ink: #20160a;
  --water: #5fb4e6;
  --danger: #e2645a;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 13px/1.4 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) 300px;
  grid-template-rows: 42px minmax(0, 1fr) 46px;
  grid-template-areas: "head head head" "tools view side" "time time time";
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
header.head {
  grid-area: head;
  display: flex; align-items: center; gap: 4px;
  padding-inline: max(10px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
  min-width: 0;
}
.brand { font-weight: 600; letter-spacing: 0.08em; margin-right: 12px; white-space: nowrap; }
.brand b { color: var(--water); font-weight: 600; }
.spacer { flex: 1; }
.menu { position: relative; }
.mbtn, .ibtn {
  height: 30px; padding: 0 10px; border: 0; border-radius: 6px;
  background: transparent; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.mbtn:hover, .ibtn:hover, .mbtn[aria-expanded="true"] { background: var(--panel-2); }
.ibtn { width: 30px; padding: 0; justify-content: center; }
.ibtn svg, .mbtn svg { width: 16px; height: 16px; flex: none; }
.ibtn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
  min-width: 210px; padding: 6px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  display: grid; gap: 1px;
}
.dropdown[hidden] { display: none; }
.dropdown .grp { padding: 6px 8px 3px; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
.dropdown button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 8px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer;
}
.dropdown button:hover, .dropdown button:focus-visible { background: rgba(242,164,58,0.16); outline: none; }
.dropdown button .k { margin-left: auto; color: var(--muted); font: 11px var(--font-data); }
.dropdown button svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.dropdown .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.dropdown .check::before { content: ""; width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; flex: none; }
.dropdown .check[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--panel-2); }

nav.tools {
  grid-area: tools;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 0;
  background: var(--panel); border-right: 1px solid var(--line);
}
.tbtn {
  width: 36px; height: 36px; border: 0; border-radius: 7px;
  background: transparent; cursor: pointer; display: grid; place-items: center;
}
.tbtn svg { width: 20px; height: 20px; }
.tbtn:hover { background: var(--panel-2); }
.tbtn[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tools .sep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; }

.view { grid-area: view; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0d0f11; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gpu { touch-action: none; outline: none; }
#overlay { pointer-events: none; }
.view-hint {
  position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 140px);
  padding: 5px 9px; border-radius: 6px;
  background: rgba(16,19,22,0.72); color: var(--text); font-size: 12px;
  pointer-events: none;
}
.view-hint kbd { font: 11px var(--font-data); padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px; background: rgba(255,255,255,0.04); }
.view-status {
  position: absolute; left: 10px; top: 10px;
  padding: 4px 8px; border-radius: 6px; background: rgba(16,19,22,0.72);
  font: 12px var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted);
  pointer-events: none;
}
.view-status b { color: var(--text); font-weight: 500; }
.navpad {
  position: absolute; right: 10px; top: 10px;
  display: grid; justify-items: center; gap: 6px;
}
.navball { width: 84px; height: 84px; border-radius: 50%; background: rgba(16,19,22,0.35); cursor: grab; touch-action: none; }
.navball:hover { background: rgba(16,19,22,0.55); }
.navbtns { display: flex; flex-direction: column; gap: 4px; }
.navbtns button {
  width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: grab; touch-action: none;
  background: rgba(16,19,22,0.6); display: grid; place-items: center;
}
.navbtns button:hover { background: rgba(40,46,52,0.9); }
.navbtns svg { width: 17px; height: 17px; }

aside.side {
  grid-area: side; min-height: 0;
  display: grid; grid-template-rows: minmax(110px, 34%) minmax(0, 1fr);
  background: var(--panel); border-left: 1px solid var(--line);
}
.side-sec { min-height: 0; display: flex; flex-direction: column; }
.side-sec + .side-sec { border-top: 1px solid var(--line); }
.sec-head {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 7px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted);
  border-bottom: 1px solid var(--line-soft);
}
.scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1; scrollbar-width: thin; }
.outliner { list-style: none; margin: 0; padding: 4px; }
.outliner li button {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer;
}
.outliner li button:hover { background: var(--panel-2); }
.outliner li button[aria-selected="true"] { background: rgba(242,164,58,0.2); color: #ffd9a3; }
.outliner svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
.outliner .kind-source svg, .outliner .kind-block svg, .outliner .kind-rain svg { color: var(--water); }
.outliner .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.outliner .off { color: var(--muted); font-size: 11px; }

.props { padding: 6px 10px 16px; display: grid; gap: 10px; }
.props .empty { color: var(--muted); padding: 10px 2px; }
.pgroup { display: grid; gap: 5px; }
.pgroup > h3 { margin: 6px 0 2px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 28px; }
.prow > label, .prow > .lbl { color: var(--muted); font-size: 12px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
.nf .ax.pre { color: var(--muted); font-family: var(--font-body); font-weight: 500; }
.nf {
  position: relative; height: 26px; border-radius: 5px; background: var(--field); border: 1px solid var(--line-soft);
  display: flex; align-items: center; cursor: ew-resize; touch-action: none; user-select: none; overflow: hidden; min-width: 0;
}
.nf:hover { border-color: var(--line); }
.nf:focus-within, .nf.focus { border-color: var(--accent); }
.nf .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(242,164,58,0.16); pointer-events: none; }
.nf .ax { position: relative; padding-left: 6px; font: 600 11px var(--font-data); }
.nf .ax.x { color: #e8625f; } .nf .ax.y { color: #8bd16a; } .nf .ax.z { color: #5c9cf0; }
.nf .val { position: relative; flex: 1; text-align: right; padding: 0 5px; font: 12px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nf input { position: absolute; inset: 0; width: 100%; border: 0; outline: 0; background: var(--field); color: var(--text); font: 12px var(--font-data); text-align: right; padding: 0 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; }
.seg button {
  flex: 1 1 auto; height: 26px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--line-soft);
  background: var(--field); cursor: pointer; white-space: nowrap; font-size: 12px;
}
.seg button:hover { border-color: var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatches button[aria-checked="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--panel); }
.txt { height: 26px; width: 100%; border-radius: 5px; border: 1px solid var(--line-soft); background: var(--field); color: var(--text); padding: 0 7px; font: inherit; }
.txt:focus { outline: none; border-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: 0; padding: 0; height: 26px; }
.toggle .sw { width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; transition: background 0.15s; }
.toggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--text); transition: transform 0.15s; }
.toggle[aria-checked="true"] .sw { background: var(--water); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(13px); }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.note b { color: var(--text); font-weight: 500; font-family: var(--font-data); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.btn {
  height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.danger { color: #ffb4ae; }
.btn svg { width: 14px; height: 14px; }

footer.time {
  grid-area: time;
  display: flex; align-items: center; gap: 6px; min-width: 0;
  padding-inline: max(10px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--panel); border-top: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.play {
  height: 32px; min-width: 88px; padding: 0 12px; border-radius: 6px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.play svg { width: 15px; height: 15px; }
.speeds { display: flex; gap: 3px; margin-left: 6px; }
.speeds button { height: 28px; padding: 0 9px; border-radius: 5px; border: 1px solid var(--line-soft); background: var(--field); cursor: pointer; font: 12px var(--font-data); white-space: nowrap; }
.speeds button:first-child { font-family: var(--font-body); }
.speeds button[aria-checked="true"] { background: var(--panel-2); border-color: var(--accent); color: #ffd9a3; }
.tinfo { margin-left: auto; display: flex; gap: 16px; font: 12px var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.tinfo b { color: var(--text); font-weight: 500; }
.meter { width: 70px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
.meter i { display: block; height: 100%; width: 0; background: var(--water); }
.meter.full i { background: var(--danger); }

.toast {
  position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 50;
  padding: 8px 14px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4); font-size: 13px; pointer-events: none;
  opacity: 0; transition: opacity 0.2s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; }
.fatal {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.fatal div { max-width: 34em; display: grid; gap: 10px; }
.fatal h2 { margin: 0; font-size: 19px; }
.fatal p { margin: 0; color: var(--muted); }

.drawer-btn { display: none; }
@media (max-width: 820px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 42px 44px minmax(0, 1fr) auto;
    grid-template-areas: "head" "tools" "view" "time";
  }
  nav.tools { flex-direction: row; justify-content: center; padding: 4px 8px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.tools .sep { width: 1px; height: 24px; margin: 0 4px; }
  aside.side {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 62%;
    border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -12px 30px rgba(0,0,0,0.45);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  aside.side:not(.open) { display: none; }
  .drawer-btn { display: inline-flex; }
  .brand { margin-right: 4px; }
  .mbtn .lbl-wide { display: none; }
  footer.time { flex-wrap: wrap; row-gap: 4px; padding-block: 6px; }
  .tinfo { margin-left: 0; width: 100%; justify-content: space-between; gap: 8px; }
  .view-hint { display: none; }
  .navball { width: 64px; height: 64px; }
}
@media (min-width: 821px) { #btn-side-close { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast, .toggle .sw, .toggle .sw::after { transition: none; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="brand">水理<b>ラボ</b></div>
    <div class="menu">
      <button class="mbtn" id="m-add" aria-haspopup="true" aria-expanded="false" title="追加（Shift+A）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>追加
      </button>
      <div class="dropdown" id="dd-add" hidden></div>
    </div>
    <div class="menu">
      <button class="mbtn" id="m-sample" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 6.5h11M6.5 6.5v7"/></svg><span class="lbl-wide">サンプル</span>
      </button>
      <div class="dropdown" id="dd-sample" hidden></div>
    </div>
    <div class="menu">
      <button class="mbtn" id="m-view" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><span class="lbl-wide">表示</span>
      </button>
      <div class="dropdown" id="dd-view" hidden></div>
    </div>
    <div class="spacer"></div>
    <button class="ibtn" id="btn-undo" title="元に戻す（Ctrl+Z）" aria-label="元に戻す" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4L2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8h-2"/></svg>
    </button>
    <button class="ibtn" id="btn-redo" title="やり直す（Ctrl+Shift+Z）" aria-label="やり直す" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4l3 3-3 3"/><path d="M13.5 7h-7a4 4 0 0 0 0 8h2"/></svg>
    </button>
    <button class="mbtn drawer-btn" id="btn-side" aria-controls="side" aria-expanded="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>シーン
    </button>
  </header>

  <nav class="tools" role="radiogroup" aria-label="編集ツール">
    <button class="tbtn" role="radio" data-tool="move" aria-checked="true" title="移動（G）" aria-label="移動">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5v15M2.5 10h15M10 2.5l-2.2 2.2M10 2.5l2.2 2.2M10 17.5l-2.2-2.2M10 17.5l2.2-2.2M2.5 10l2.2-2.2M2.5 10l2.2 2.2M17.5 10l-2.2-2.2M17.5 10l-2.2 2.2"/></svg>
    </button>
    <button class="tbtn" role="radio" data-tool="rotate" aria-checked="false" title="回転（R）" aria-label="回転">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M14.5 2.5v3.3h-3.3"/></svg>
    </button>
    <button class="tbtn" role="radio" data-tool="scale" aria-checked="false" title="寸法（S）" aria-label="寸法">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="8" height="8" rx="1"/><path d="M10 3h7v7M17 3l-6.5 6.5"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tbtn" id="btn-dup" title="複製（Shift+D）" aria-label="複製">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5"/><path d="M13.5 6.5v-2a1 1 0 0 0-1-1h-8a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2"/></svg>
    </button>
    <button class="tbtn" id="btn-del" title="削除（X / Delete）" aria-label="削除">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 5.5h12M8 5.5V4h4v1.5M5.5 5.5l.8 11h7.4l.8-11"/></svg>
    </button>
  </nav>

  <main class="view" id="view">
    <canvas id="gpu" tabindex="0" aria-label="3Dビュー"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div class="view-status" id="status"></div>
    <div class="navpad">
      <div class="navball" id="navball" title="ドラッグで視点を回転・軸をクリックでその方向から見る" role="img" aria-label="視点の回転"></div>
      <div class="navbtns">
        <button id="nav-zoom" title="上下にドラッグで拡大縮小" aria-label="拡大縮小">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="4.5"/><path d="M11 11l4.5 4.5M5.5 7.5h4M7.5 5.5v4"/></svg>
        </button>
        <button id="nav-pan" title="ドラッグで視点を平行移動" aria-label="平行移動">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5V4.2a1.1 1.1 0 0 1 2.2 0V8M8.2 7.5V3.2a1.1 1.1 0 0 1 2.2 0V8M10.4 7.8V4.4a1.1 1.1 0 0 1 2.2 0V9.5M12.6 8.2a1.1 1.1 0 0 1 2.2 0v2.6a5 5 0 0 1-5 5H9a4.2 4.2 0 0 1-3.5-1.9L3.4 11a1.2 1.2 0 0 1 1.9-1.5L6 10.5"/></svg>
        </button>
      </div>
    </div>
    <div class="view-hint" id="hint"></div>

// source outlet geometry derived from flow and speed
function sourceNozzle(src) {

}

// ---------- signed distance (mirrors the WGSL code; used for picking and placement) ----------

// GPU parameters of an obstacle: [type, d0, d1, d2, d3]
function shapeParams(o) {

    case 'plate': return [0, d.w / 2, d.t / 2, d.d / 2, Math.min(0.002, d.t / 4)];

  const [t, a, b, c, e] = shapeParams(o);
  switch (t) {
    case 0: return Math.hypot(a, b, c);
    case 1: return a;
    case 2: case 3: case 5: return Math.hypot(a, b);
    case 4: return a + b;
    case 6: return Math.hypot(a, b, c);
    case 7: return Math.hypot(a, b + c);
  }
  return 0.1;
}
// lowest point of an obstacle in world space (for dropping new objects onto the floor)
function obstacleBottom(o) {
  const R = obstacleRot(o);
  let lo = Infinity;
  const r = boundRadius(o);
  // sample the bounding sphere's surface by sphere tracing straight up from below
  for (let i = -2; i <= 2; i++) for (let k = -2; k <= 2; k++) {
    const x = o.pos[0] + (i / 2) * r * 0.9, z = o.pos[2] + (k / 2) * r * 0.9;
    let y = o.pos[1] - r - 0.01;
    for (let s = 0; s < 64; s++) {
      const d = obstacleSdf(o, [x, y, z], R);
      if (d < 0.0005) { lo = Math.min(lo, y); break; }
      y += Math.max(d, 0.0005);
      if (y > o.pos[1] + r) break;
    }
  }
  return lo === Infinity ? o.pos[1] - r : lo;
}

// ============================================================
//  Triangle meshes for obstacles and props (local space, meters)
// ============================================================
class MeshBuilder {
  constructor() { this.v = []; this.i = []; }
  vert(p, n) { this.v.push(p[0], p[1], p[2], n[0], n[1], n[2]); return this.v.length / 6 - 1; }
  // triangle wound counter-clockwise when seen from the side its vertex normals face
  tri(a, b, c) {
    const V = this.v;
    const pa = [V[a * 6], V[a * 6 + 1], V[a * 6 + 2]], pb = [V[b * 6], V[b * 6 + 1], V[b * 6 + 2]], pc = [V[c * 6], V[c * 6 + 1], V[c * 6 + 2]];
    const cr = v3.cross(v3.sub(pb, pa), v3.sub(pc, pa));
    const n = [V[a * 6 + 3] + V[b * 6 + 3] + V[c * 6 + 3], V[a * 6 + 4] + V[b * 6 + 4] + V[c * 6 + 4], V[a * 6 + 5] + V[b * 6 + 5] + V[c * 6 + 5]];
    if (v3.dot(cr, n) >= 0) this.i.push(a, b, c); else this.i.push(a, c, b);
  }
  quad(a, b, c, d) { this.tri(a, b, c); this.tri(a, c, d); }
  grid(rows, cols, at) {
    // at(i, j) -> [pos, nrm]; connects a rows x cols lattice
    const base = this.v.length / 6;
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) { const [p, n] = at(i, j); this.vert(p, n); }
    for (let i = 0; i < rows - 1; i++) for (let j = 0; j < cols - 1; j++) {
      const a = base + i * cols + j;
      this.quad(a, a + 1, a + cols + 1, a + cols);
    }
  }
  transformed(R, t) {
    const out = new MeshBuilder();
    out.i = this.i.slice();
    for (let k = 0; k < this.v.length; k += 6) {
      const p = v3.add(m3.apply(R, [this.v[k], this.v[k + 1], this.v[k + 2]]), t);
      const n = m3.apply(R, [this.v[k + 3], this.v[k + 4], this.v[k + 5]]);
      out.v.push(p[0], p[1], p[2], n[0], n[1], n[2]);
    }
    return out;
  }
  merge(o) {
    const base = this.v.length / 6;
    for (const x of o.v) this.v.push(x);
    for (const x of o.i) this.i.push(x + base);
    return this;
  }
  build() { return { verts: new Float32Array(this.v), idx: new Uint32Array(this.i) }; }
}

function meshRoundBox(hx, hy, hz, r) {
  r = Math.max(0, Math.min(r, hx, hy, hz));
  const ticks = (h) => {
    const t = [];
    const steps = r > 0 ? 3 : 0;
    for (let k = steps; k >= 1; k--) t.push(-h + r - r * Math.tan((k / steps) * Math.PI / 4));
    t.push(-h + r, h - r);
    for (let k = 1; k <= steps; k++) t.push(h - r + r * Math.tan((k / steps) * Math.PI / 4));
    return t;
  };
  const H = [hx, hy, hz];
  const mb = new MeshBuilder();
  for (let axis = 0; axis < 3; axis++) for (const sgn of [-1, 1]) {
    const a1 = (axis + 1) % 3, a2 = (axis + 2) % 3;
    const t1 = ticks(H[a1]), t2 = ticks(H[a2]);
    mb.grid(t1.length, t2.length, (i, j) => {
      const p = [0, 0, 0];
      p[axis] = sgn * H[axis]; p[a1] = t1[i]; p[a2] = t2[j];
      const inner = p.map((x, k) => clamp(x, -(H[k] - r), H[k] - r));
      let n = v3.sub(p, inner);
      if (v3.len(n) < 1e-9) { n = [0, 0, 0]; n[axis] = sgn; }
      n = v3.norm(n);
      return [r > 0 ? v3.add(inner, v3.mul(n, r)) : p, n];
    });
  }
  return mb;
}

function meshSphere(r, seg = 40) {
  const mb = new MeshBuilder();
  const rows = seg / 2 + 1, cols = seg + 1;
  mb.grid(rows, cols, (i, j) => {
    const th = (i / (rows - 1)) * Math.PI, ph = (j / (cols - 1)) * Math.PI * 2;
    const n = [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
    return [v3.mul(n, r), n];
  });
  return mb;
}

// Revolve profile strips around the y axis. Each strip is an array of [radius, y, normalRadial, normalY].
function meshLathe(strips, seg = 48) {
  const mb = new MeshBuilder();
  for (const strip of strips) {
    mb.grid(strip.length, seg + 1, (i, j) => {
      const [r, y, nr, ny] = strip[i];
      const a = (j / seg) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      const n = v3.norm([nr * c, ny, nr * s]);
      return [[r * c, y, r * s], n];
    });
  }
  return mb;
}
// quarter/half arcs used by profiles: centre (cx, cy), radius b, angles in radians
function arc(cx, cy, b, a0, a1, steps) {
  const out = [];
  for (let k = 0; k <= steps; k++) {
    const a = a0 + (a1 - a0) * (k / steps);
    out.push([cx + b * Math.cos(a), cy + b * Math.sin(a), Math.cos(a), Math.sin(a)]);
  }
  return out;
}
function meshCylinder(r, hh) {
  const b = Math.min(0.002, r / 4, hh / 4);
  const strip = [[0, -hh, 0, -1], ...arc(r - b, -hh + b, b, -Math.PI / 2, 0, 3), ...arc(r - b, hh - b, b, 0, Math.PI / 2, 3), [0, hh, 0, 1]];
  return meshLathe([strip]);
}
function meshCone(r, hh) {
  const len = Math.hypot(r, 2 * hh);
  const nr = (2 * hh) / len, ny = r / len;
  const side = [];
  for (let k = 0; k <= 8; k++) { const t = k / 8; side.push([r * (1 - t), -hh + 2 * hh * t, nr, ny]); }
  return meshLathe([[[0, -hh, 0, -1], [r, -hh, 0, -1]], side]);
}
function meshTorus(R, r) {
  return meshLathe([arc(R, 0, r, -Math.PI, Math.PI, 28)], 56);
}
function meshCup(r, hh, t) {
  const lip = t / 2;
  const outer = [[0, -hh, 0, -1], ...arc(r - 0.002, -hh + 0.002, 0.002, -Math.PI / 2, 0, 3), [r, hh - lip, 1, 0], ...arc(r - lip, hh - lip, lip, 0, Math.PI, 8), [r - t, hh - lip, -1, 0], [r - t, -hh + t, -1, 0]];
  const inner = [[r - t, -hh + t, 0, 1], [0, -hh + t, 0, 1]];
  return meshLathe([outer, inner]);
}
function meshContainer(hx, hy, hz, t) {
  const mb = new MeshBuilder();
  const part = (sx, sy, sz, cx, cy, cz) => mb.merge(meshRoundBox(sx, sy, sz, Math.min(0.0015, sx, sy, sz)).transformed([1, 0, 0, 0, 1, 0, 0, 0, 1], [cx, cy, cz]));
  part(hx, t / 2, hz, 0, -hy + t / 2, 0);
  part(t / 2, hy, hz, -hx + t / 2, 0, 0);
  part(t / 2, hy, hz, hx - t / 2, 0, 0);
  part(hx - t, hy, t / 2, 0, 0, -hz + t / 2);
  part(hx - t, hy, t / 2, 0, 0, hz - t / 2);
  return mb;
}
function meshGutter(hl, R, t) {
  const mb = new MeshBuilder();
  const seg = 28;
  const ro = R + t / 2, ri = R - t / 2;
  // outer and inner shells (lower half), extruded along x
  for (const [rad, sgn] of [[ro, 1], [ri, -1]]) {
    mb.grid(seg + 1, 2, (i, j) => {
      const ph = (i / seg) * Math.PI;
      const dirYZ = [-Math.sin(ph), Math.cos(ph)];
      return [[j ? hl : -hl, dirYZ[0] * rad, dirYZ[1] * rad], [0, dirYZ[0] * sgn, dirYZ[1] * sgn]];
    });
  }
  // flat top edges
  for (const zs of [1, -1]) {
    const a = mb.vert([-hl, 0, zs * ri], [0, 1, 0]), b = mb.vert([hl, 0, zs * ri], [0, 1, 0]);
    const c = mb.vert([hl, 0, zs * ro], [0, 1, 0]), d = mb.vert([-hl, 0, zs * ro], [0, 1, 0]);
    mb.quad(a, b, c, d);
  }
  // end caps
  for (const xs of [1, -1]) {
    const n = [xs, 0, 0];
    const base = mb.v.length / 6;
    for (let i = 0; i <= seg; i++) {
      const ph = (i / seg) * Math.PI;
      const y = -Math.sin(ph), z = Math.cos(ph);
      mb.vert([xs * hl, y * ro, z * ro], n);
      mb.vert([xs * hl, y * ri, z * ri], n);
    }
    for (let i = 0; i < seg; i++) mb.quad(base + i * 2, base + i * 2 + 2, base + i * 2 + 3, base + i * 2 + 1);
  }
  return mb;
}
function meshNozzle(d) {
  const ri = Math.max(d / 2, 0.002), ro = ri + 0.003, len = 0.045;
  const outer = [[ri, 0, 0, -1], [ro, 0, 0, -1], [ro, 0, 1, 0], [ro, len, 1, 0], [ro, len, 0, 1], [0, len, 0, 1]];
  const inner = [[ri, 0, -1, 0], [ri, len * 0.6, -1, 0]];
  return meshLathe([outer.slice(0, 2), outer.slice(2, 4), outer.slice(4), inner], 32);
}
function meshDrainRing(r) {
  const rw = 0.004;
  return meshLathe([[[r - rw, 0.0015, 0, 1], [r + rw, 0.0015, 0, 1]], [[r + rw, 0.0015, 1, 0.2], [r + rw, 0.0002, 1, 0]], [[r - rw, 0.0002, -1, 0], [r - rw, 0.0015, -1, 0.2]]], 40);
}
function meshDisc(r, y) {
  return meshLathe([[[0, y, 0, 1], [r, y, 0, 1]]], 40);
}
function meshBlockBox() { return meshRoundBox(0.5, 0.5, 0.5, 0); }

function meshForObstacle(o) {
  const [t, a, b, c, e] = shapeParams(o);
  switch (t) {
    case 0: return meshRoundBox(a, b, c, e);
    case 1: return meshSphere(a);
    case 2: return meshCylinder(a, b);
    case 3: return meshCone(a, b);
    case 4: return meshTorus(a, b);
    case 5: return meshCup(a, b, c);
    case 6: return meshContainer(a, b, c, e);
    case 7: return meshGutter(a, b, c);
  }
  return meshRoundBox(0.05, 0.05, 0.05, 0);
}

// ============================================================
//  WGSL: FLIP liquid solver on a staggered (MAC) grid with cut-cell solid fractions
// ============================================================
const VSCALE = 262144.0;   // fixed-point scale for atomic momentum / weight sums
const RIPPLE_SCALE = 1e9;  // fixed-point scale for ripple impulses [N·s]

const WGSL_SIM_COMMON = /* wgsl */`
struct Params {
  dims: vec4u,     // nx, ny, nz, node count
  ext: vec4u,      // cell count, particle capacity, object count, frame
  origin: vec4f,   // grid min corner, cell size h
  phys: vec4f,     // dt, gravity, flip ratio, 1/h
  phys2: vec4f,    // particles per cell at rest, drift correction, SOR omega, collision radius
  tank: vec4f,     // rim height, whitewater rate, whitewater capacity, wall friction
  misc: vec4f,     // time, render radius, unused, unused
};
struct Particle { pos: vec4f, vel: vec4f };
struct Obj { r0: vec4f, r1: vec4f, r2: vec4f, pos: vec4f, dims: vec4f, vel: vec4f, angv: vec4f };
@group(0) @binding(0) var<uniform> P: Params;
const VS: f32 = ${VSCALE.toFixed(1)};

fn NX() -> i32 { return i32(P.dims.x); }
fn NY() -> i32 { return i32(P.dims.y); }
fn NZ() -> i32 { return i32(P.dims.z); }
fn nodeIdx(i: i32, j: i32, k: i32) -> u32 { return u32(i + (j + k * (NY() + 1)) * (NX() + 1)); }
fn cellIdx(i: i32, j: i32, k: i32) -> u32 { return u32(i + (j + k * NY()) * NX()); }
fn nodeCoord(n: u32) -> vec3i {
  let sx = P.dims.x + 1u; let sy = P.dims.y + 1u;
  return vec3i(i32(n % sx), i32((n / sx) % sy), i32(n / (sx * sy)));
}
fn cellCoord(c: u32) -> vec3i {
  return vec3i(i32(c % P.dims.x), i32((c / P.dims.x) % P.dims.y), i32(c / (P.dims.x * P.dims.y)));
}
fn gridPos(x: vec3f) -> vec3f { return (x - P.origin.xyz) * P.phys.w; }
fn inGrid(g: vec3f) -> bool { return all(g >= vec3f(0.0)) && all(g < vec3f(P.dims.xyz)); }
fn hashU(a: u32) -> u32 { var x = a; x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return x; }
fn rnd(s: ptr<function, u32>) -> f32 { *s = hashU(*s); return f32(*s >> 8u) / 16777216.0; }
`;

const WGSL_SDF = (binding) => /* wgsl */`
@group(0) @binding(${binding}) var<storage, read> objs: array<Obj>;
fn toLocal(o: Obj, p: vec3f) -> vec3f { let d = p - o.pos.xyz; return vec3f(dot(o.r0.xyz, d), dot(o.r1.xyz, d), dot(o.r2.xyz, d)); }
fn sdRoundBox(p: vec3f, b: vec3f, r: f32) -> f32 {
  let q = abs(p) - b + vec3f(r);
  return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
fn sdCyl(p: vec3f, r: f32, hh: f32) -> f32 {
  let d = vec2f(length(p.xz) - r, abs(p.y) - hh);
  return min(max(d.x, d.y), 0.0) + length(max(d, vec2f(0.0)));
}
fn sdCone(p: vec3f, r: f32, hh: f32) -> f32 {
  let q = vec2f(length(p.xz), p.y);
  let k1 = vec2f(0.0, hh);
  let k2 = vec2f(-r, 2.0 * hh);
  let ca = vec2f(q.x - min(q.x, select(0.0, r, q.y < 0.0)), abs(q.y) - hh);
  let cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot(k2, k2), 0.0, 1.0);
  let s = select(1.0, -1.0, cb.x < 0.0 && ca.y < 0.0);
  return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}
fn shapeSdf(o: Obj, p: vec3f) -> f32 {
  let q = toLocal(o, p);
  let d = o.dims;
  let t = u32(o.pos.w + 0.5);
  var r = 1e9;
  switch t {
    case 0u: { r = sdRoundBox(q, d.xyz, d.w); }
    case 1u: { r = length(q) - d.x; }
    case 2u: { r = sdCyl(q, d.x, d.y); }
    case 3u: { r = sdCone(q, d.x, d.y); }
    case 4u: { r = length(vec2f(length(q.xz) - d.x, q.y)) - d.y; }
    case 5u: { r = max(sdCyl(q, d.x, d.y), -sdCyl(q - vec3f(0.0, d.z, 0.0), d.x - d.z, d.y)); }
    case 6u: { r = max(sdRoundBox(q, d.xyz, 0.002), -sdRoundBox(q - vec3f(0.0, d.w, 0.0), d.xyz - vec3f(d.w, 0.0, d.w), 0.001)); }
    case 7u: { r = max(max(abs(length(q.yz) - d.y) - 0.5 * d.z, q.y), abs(q.x) - d.x); }
    default: { }
  }
  return r;
}
fn sceneSdf(p: vec3f) -> f32 {
  var best = 1e9;
  for (var i = 0u; i < P.ext.z; i++) {
    let o = objs[i];
    if (o.angv.w != 1.0) { continue; }
    if (length(p - o.pos.xyz) - o.vel.w > best) { continue; }
    best = min(best, shapeSdf(o, p));
  }
  return best;
}
fn sceneNormal(p: vec3f) -> vec3f {
  let e = 0.0006;
  let n = vec3f(sceneSdf(p + vec3f(e, 0.0, 0.0)) - sceneSdf(p - vec3f(e, 0.0, 0.0)),
                sceneSdf(p + vec3f(0.0, e, 0.0)) - sceneSdf(p - vec3f(0.0, e, 0.0)),
                sceneSdf(p + vec3f(0.0, 0.0, e)) - sceneSdf(p - vec3f(0.0, 0.0, e)));
  let l = length(n);
  return select(vec3f(0.0, 1.0, 0.0), n / l, l > 1e-9);
}
fn solidVelAt(p: vec3f) -> vec3f {
  var best = 1e9; var v = vec3f(0.0);
  for (var i = 0u; i < P.ext.z; i++) {
    let o = objs[i];
    if (o.angv.w != 1.0) { continue; }
    if (length(p - o.pos.xyz) - o.vel.w > best) { continue; }
    let d = shapeSdf(o, p);
    if (d < best) { best = d; v = o.vel.xyz + cross(o.angv.xyz, p - o.pos.xyz); }
  }
  return v;
}
fn inDrain(p: vec3f) -> bool {
  for (var i = 0u; i < P.ext.z; i++) {
    let o = objs[i];
    if (o.angv.w != 2.0) { continue; }
    if (sdCyl(toLocal(o, p), o.dims.x, o.dims.y) < 0.0) { return true; }
  }
  return false;
}
`;

const WGSL_GEOM = WGSL_SIM_COMMON + WGSL_SDF(1) + /* wgsl */`
@group(0) @binding(2) var<storage, read_write> frac: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> svel: array<vec4f>;
fn faceOpen(c: vec3f, axis: u32) -> f32 {
  let a = 0.5 * P.origin.w;
  var o1 = vec3f(0.0); var o2 = vec3f(0.0);
  if (axis == 0u) { o1 = vec3f(0.0, a, 0.0); o2 = vec3f(0.0, 0.0, a); }
  else if (axis == 1u) { o1 = vec3f(a, 0.0, 0.0); o2 = vec3f(0.0, 0.0, a); }
  else { o1 = vec3f(a, 0.0, 0.0); o2 = vec3f(0.0, a, 0.0); }
  let s0 = sceneSdf(c - o1 - o2); let s1 = sceneSdf(c + o1 - o2);
  let s2 = sceneSdf(c + o1 + o2); let s3 = sceneSdf(c - o1 + o2);
  let sc = sceneSdf(c);
  let pos = max(s0, 0.0) + max(s1, 0.0) + max(s2, 0.0) + max(s3, 0.0) + 2.0 * max(sc, 0.0);
  let tot = abs(s0) + abs(s1) + abs(s2) + abs(s3) + 2.0 * abs(sc);
  if (tot < 1e-12) { return 1.0; }
  return clamp(pos / tot, 0.0, 1.0);
}
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let n = gid.x;
  if (n >= P.dims.w) { return; }
  let c = nodeCoord(n);
  let h = P.origin.w;
  let o = P.origin.xyz;
  var fr = vec4f(0.0);
  var sv = vec4f(0.0);
  if (c.y < NY() && c.z < NZ() && c.x > 0 && c.x < NX()) {
    let p = o + h * vec3f(f32(c.x), f32(c.y) + 0.5, f32(c.z) + 0.5);
    fr.x = faceOpen(p, 0u); sv.x = solidVelAt(p).x;
  }
  if (c.x < NX() && c.z < NZ() && c.y > 0) {
    if (c.y >= NY()) { fr.y = 1.0; }
    else { let p = o + h * vec3f(f32(c.x) + 0.5, f32(c.y), f32(c.z) + 0.5); fr.y = faceOpen(p, 1u); sv.y = solidVelAt(p).y; }
  }
  if (c.x < NX() && c.y < NY() && c.z > 0 && c.z < NZ()) {
    let p = o + h * vec3f(f32(c.x) + 0.5, f32(c.y) + 0.5, f32(c.z));
    fr.z = faceOpen(p, 2u); sv.z = solidVelAt(p).z;
  }
  frac[n] = fr;
  svel[n] = sv;
}`;

const WGSL_P2G = WGSL_SIM_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> parts: array<Particle>;

@group(0) @binding(3) var<storage, read_write> acc: array<atomic<i32>>;
@group(0) @binding(4) var<storage, read_write> cellCount: array<atomic<u32>>;
fn splat(q: vec3f, val: f32, comp: u32) {
  let b = vec3i(floor(q));
  let f = q - vec3f(b);
  for (var dz = 0; dz < 2; dz++) {
    let k = b.z + dz;
    if (k < 0 || k > NZ()) { continue; }
    let wz = select(1.0 - f.z, f.z, dz == 1);
    for (var dy = 0; dy < 2; dy++) {
      let j = b.y + dy;
      if (j < 0 || j > NY()) { continue; }
      let wy = select(1.0 - f.y, f.y, dy == 1);
      for (var dx = 0; dx < 2; dx++) {
        let i = b.x + dx;
        if (i < 0 || i > NX()) { continue; }
        let w = select(1.0 - f.x, f.x, dx == 1) * wy * wz;
        if (w <= 0.0) { continue; }
        let n = nodeIdx(i, j, k) * 6u + comp * 2u;
        atomicAdd(&acc[n], i32(round(w * val * VS)));
        atomicAdd(&acc[n + 1u], i32(round(w * VS)));
      }
    }
  }
}
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {

  let g = gridPos(p.pos.xyz);
  if (!inGrid(g)) { return; }
  let c = vec3i(g);
  atomicAdd(&cellCount[cellIdx(c.x, c.y, c.z)], 1u);
  let v = clamp(p.vel.xyz, vec3f(-30.0), vec3f(30.0));
  splat(g - vec3f(0.0, 0.5, 0.5), v.x, 0u);
  splat(g - vec3f(0.5, 0.0, 0.5), v.y, 1u);
  splat(g - vec3f(0.5, 0.5, 0.0), v.z, 2u);
}`;

const WGSL_DIVERGENCE = WGSL_SIM_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> vel: array<vec4f>;
@group(0) @binding(2) var<storage, read> frac: array<vec4f>;
@group(0) @binding(3) var<storage, read> svel: array<vec4f>;
@group(0) @binding(4) var<storage, read> cellType: array<u32>;
@group(0) @binding(5) var<storage, read> cellCount: array<u32>;
@group(0) @binding(6) var<storage, read_write> divg: array<f32>;
fn flux(f: f32, v: f32, s: f32) -> f32 { return f * v + (1.0 - f) * s; }
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let c = gid.x;
  if (c >= P.ext.x) { return; }
  if (cellType[c] != 1u) { divg[c] = 0.0; return; }
  let q = cellCoord(c);
  let n0 = nodeIdx(q.x, q.y, q.z);
  let nx = nodeIdx(q.x + 1, q.y, q.z);
  let ny = nodeIdx(q.x, q.y + 1, q.z);
  let nz = nodeIdx(q.x, q.y, q.z + 1);
  let f0 = frac[n0]; let v0 = vel[n0]; let s0 = svel[n0];
  var d = flux(frac[nx].x, vel[nx].x, svel[nx].x) - flux(f0.x, v0.x, s0.x);
  d += flux(frac[ny].y, vel[ny].y, svel[ny].y) - flux(f0.y, v0.y, s0.y);
  d += flux(frac[nz].z, vel[nz].z, svel[nz].z) - flux(f0.z, v0.z, s0.z);
  d *= P.phys.w;

// red-black Gauss-Seidel with over-relaxation
const WGSL_PRESSURE = WGSL_SIM_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read> frac: array<vec4f>;
@group(0) @binding(2) var<storage, read> cellType: array<u32>;
@group(0) @binding(3) var<storage, read> divg: array<f32>;
@group(0) @binding(4) var<storage, read_write> pres: array<f32>;
@group(0) @binding(5) var<uniform> parity: vec4u;
fn nb(c: u32, f: f32, ok: bool, num: ptr<function, f32>, den: ptr<function, f32>) {
  if (f <= 0.0) { return; }
  *den += f;
  if (ok && cellType[c] == 1u) { *num += f * pres[c]; }
}
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let c = gid.x;
  if (c >= P.ext.x) { return; }
  let q = cellCoord(c);
  if (u32((q.x + q.y + q.z) & 1) != parity.x) { return; }
  if (cellType[c] != 1u) { pres[c] = 0.0; return; }
  var num = 0.0; var den = 0.0;
  let sx = 1u; let sy = P.dims.x; let sz = P.dims.x * P.dims.y;
  nb(c - select(0u, sx, q.x > 0), frac[nodeIdx(q.x, q.y, q.z)].x, q.x > 0, &num, &den);
  nb(c + sx, frac[nodeIdx(q.x + 1, q.y, q.z)].x, q.x < NX() - 1, &num, &den);
  nb(c - select(0u, sy, q.y > 0), frac[nodeIdx(q.x, q.y, q.z)].y, q.y > 0, &num, &den);
  nb(c + sy, frac[nodeIdx(q.x, q.y + 1, q.z)].y, q.y < NY() - 1, &num, &den);
  nb(c - select(0u, sz, q.z > 0), frac[nodeIdx(q.x, q.y, q.z)].z, q.z > 0, &num, &den);
  nb(c + sz, frac[nodeIdx(q.x, q.y, q.z + 1)].z, q.z < NZ() - 1, &num, &den);
  if (den > 0.0) {
    let h = P.origin.w;
    let pn = (num - h * h * divg[c]) / den;
    pres[c] = mix(pres[c], pn, P.phys2.z);
  }
}`;

const WGSL_PROJECT = WGSL_SIM_COMMON + /* wgsl */`
@group(0) @binding(1) var<storage, read_write> vel: array<vec4f>;
@group(0) @binding(2) var<storage, read> frac: array<vec4f>;
@group(0) @binding(3) var<storage, read> svel: array<vec4f>;
@group(0) @binding(4) var<storage, read> cellType: array<u32>;
@group(0) @binding(5) var<storage, read> pres: array<f32>;
// type and pressure of a cell; outside the side walls and floor counts as solid (2), above the grid as air (0)
fn ctype(i: i32, j: i32, k: i32) -> u32 {
  if (j >= NY()) { return 0u; }
  if (i < 0 || j < 0 || k < 0 || i >= NX() || k >= NZ()) { return 2u; }
  return cellType[cellIdx(i, j, k)];
}
fn cpres(i: i32, j: i32, k: i32) -> f32 {
  if (ctype(i, j, k) != 1u) { return 0.0; }
  return pres[cellIdx(i, j, k)];
}
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let n = gid.x;
  if (n >= P.dims.w) { return; }
  let c = nodeCoord(n);
  var v = vel[n];
  let f = frac[n]; let s = svel[n];
  let ih = P.phys.w;
  if (c.y < NY() && c.z < NZ()) {
    if (f.x <= 0.0) { v.x = s.x; }
    else if (ctype(c.x - 1, c.y, c.z) == 1u || ctype(c.x, c.y, c.z) == 1u) {
      v.x -= (cpres(c.x, c.y, c.z) - cpres(c.x - 1, c.y, c.z)) * ih;
    }
  }
  if (c.x < NX() && c.z < NZ()) {
    if (f.y <= 0.0) { v.y = s.y; }
    else if (ctype(c.x, c.y - 1, c.z) == 1u || ctype(c.x, c.y, c.z) == 1u) {
      v.y -= (cpres(c.x, c.y, c.z) - cpres(c.x, c.y - 1, c.z)) * ih;
    }
  }
  if (c.x < NX() && c.y < NY()) {
    if (f.z <= 0.0) { v.z = s.z; }
    else if (ctype(c.x, c.y, c.z - 1) == 1u || ctype(c.x, c.y, c.z) == 1u) {
      v.z -= (cpres(c.x, c.y, c.z) - cpres(c.x, c.y, c.z - 1)) * ih;
    }
  }
  vel[n] = v;
}`;

const WGSL_TRANSFER = /* wgsl */`
fn transfer1(q: vec3f, comp: u32, vp: f32) -> vec3f {
  let b = vec3i(floor(q));
  let f = q - vec3f(b);
  var sn = 0.0; var so = 0.0; var sw = 0.0;
  let bit = 1u << comp;
  for (var dz = 0; dz < 2; dz++) {
    let k = b.z + dz;
    if (k < 0 || k > NZ()) { continue; }
    let wz = select(1.0 - f.z, f.z, dz == 1);
    for (var dy = 0; dy < 2; dy++) {
      let j = b.y + dy;
      if (j < 0 || j > NY()) { continue; }
      let wy = select(1.0 - f.y, f.y, dy == 1);
      for (var dx = 0; dx < 2; dx++) {
        let i = b.x + dx;
        if (i < 0 || i > NX()) { continue; }
        let n = nodeIdx(i, j, k);
        if ((u32(velOld[n].w) & bit) == 0u) { continue; }
        let w = select(1.0 - f.x, f.x, dx == 1) * wy * wz;
        sn += w * vel[n][comp];
        so += w * velOld[n][comp];
        sw += w;
      }
    }
  }
  if (sw < 1e-6) { return vec3f(vp, vp, 0.0); }
  return vec3f(sn / sw, vp + (sn - so) / sw, 1.0);
}
`;

const WGSL_TANK = /* wgsl */`
fn fpMin() -> vec2f { return P.origin.xz; }
fn fpMax() -> vec2f { return P.origin.xz + vec2f(f32(P.dims.x), f32(P.dims.z)) * P.origin.w; }
fn inFootprint(x: vec3f) -> bool { return all(x.xz > fpMin()) && all(x.xz < fpMax()); }
// keeps particles inside the glass walls below the rim, and outside them when they come from outside
fn tankClamp(x0: vec3f, x: ptr<function, vec3f>, v: ptr<function, vec3f>, r: f32) {
  let lo = fpMin(); let hi = fpMax();
  let wasIn = inFootprint(x0);
  if (wasIn && (*x).y < P.tank.x) {
    if ((*x).x < lo.x + r) { (*x).x = lo.x + r; (*v).x = max((*v).x, 0.0); }
    if ((*x).x > hi.x - r) { (*x).x = hi.x - r; (*v).x = min((*v).x, 0.0); }
    if ((*x).z < lo.y + r) { (*x).z = lo.y + r; (*v).z = max((*v).z, 0.0); }
    if ((*x).z > hi.y - r) { (*x).z = hi.y - r; (*v).z = min((*v).z, 0.0); }
  }
  if (wasIn && (*x).y < P.origin.y + r) { (*x).y = P.origin.y + r; (*v).y = max((*v).y, 0.0); }
  if (!wasIn && (*x).y < P.tank.x && inFootprint(*x)) {
    *x = vec3f(x0.x, (*x).y, x0.z);
    *v = vec3f(-0.2 * (*v).x, (*v).y, -0.2 * (*v).z);
  }
}

  let cap = u32(P.tank.z);
  let r0 = 0.35 * P.origin.w;
  let ph0 = rnd(&s) * 6.2831853;
  for (var i = 0u; i < n; i++) {
    let k = base + i;
    if (k >= cap) { return; }
    let ph = ph0 + 6.2831853 * (f32(i) + 0.3 * rnd(&s)) / f32(n);
    let el = 0.9 + 0.45 * rnd(&s);
    let sp = U * (0.15 + 0.2 * rnd(&s));
    let d = vec3f(cos(ph), 0.0, sin(ph));
    ww[k] = Particle(vec4f(x + d * r0, 0.5 + 0.4 * rnd(&s)), vec4f(d * cos(el) * sp + vec3f(0.0, sin(el) * sp, 0.0), 0.0));
  }
  for (var j = 0u; j < nj; j++) {
    let k = base + n + j;
    if (k >= cap) { return; }
    let sp = U * (0.22 + 0.04 * f32(j)) * (0.9 + 0.2 * rnd(&s));
    ww[k] = Particle(vec4f(x + vec3f(0.0, 0.001 * f32(j), 0.0), 0.7), vec4f((rnd(&s) - 0.5) * 0.05, sp, (rnd(&s) - 0.5) * 0.05, 0.0));
  }
}
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let id = gid.x;
  if (id >= atomicLoad(&C.count)) { return; }
  let p = parts[id];
  if (p.pos.w < 0.5) { return; }
  let dt = P.phys.x;
  let h = P.origin.w;
  let x0 = p.pos.xyz;
  var v = p.vel.xyz;
  let g = gridPos(x0);
  let ing = inGrid(g);
  if (ing) {
    let tx = transfer1(g - vec3f(0.0, 0.5, 0.5), 0u, v.x);
    let ty = transfer1(g - vec3f(0.5, 0.0, 0.5), 1u, v.y);
    let tz = transfer1(g - vec3f(0.5, 0.5, 0.0), 2u, v.z);
    v = mix(vec3f(tx.x, ty.x, tz.x), vec3f(tx.y, ty.y, tz.y), P.phys.z);
  } else {
    v.y -= P.phys.y * dt;
  }
  var x = x0 + v * dt;
  let rc = P.phys2.w;
  let d = sceneSdf(x);
  if (d < rc) {
    let nrm = sceneNormal(x);
    x += nrm * (rc - d);
    let vs = solidVelAt(x);
    let rel = v - vs;
    let vn = dot(rel, nrm);
    if (vn < 0.0) { v = vs + (rel - nrm * vn) * (1.0 - P.tank.w); }
  }
  tankClamp(x0, &x, &v, rc);
  var alive = 1.0;
  if (inDrain(x)) { alive = 0.0; }
  if (!inFootprint(x) && x.y < 0.002) { alive = 0.0; }
  if (any(abs(x.xz) > vec2f(20.0)) || x.y < -1.0 || x.y > 30.0) { alive = 0.0; }
  // A drop smaller than a cell that falls out of open air into resolved liquid cannot be stopped by the grid: the
  // cells it enters are dominated by the liquid's own particles, so FLIP would carry it straight through the pool.
  // It merges with the liquid instead. The momentum it brings becomes a pressure impulse on the surface (ripple layer)
  // and a crown splash, and from then on it moves with the liquid around it.
  // vel.w marks a particle that has been flying free (alone in its neighbourhood) since it last belonged to liquid.
  let c0 = vec3i(g);
  var airborne = p.vel.w;
  if (!ing) { airborne = 1.0; }
  else {
    let n0 = countAt(c0);
    if (n0 >= 4u) { airborne = 0.0; }
    else if (n0 <= 2u) {
      var around = 0u;
      for (var dz = -1; dz <= 1; dz++) {
        for (var dy = -1; dy <= 1; dy++) {
          for (var dx = -1; dx <= 1; dx++) { around += countAt(c0 + vec3i(dx, dy, dz)); }
        }
      }
      if (around <= 4u) { airborne = 1.0; }
    }
  }
  let g1 = gridPos(x);
  let c1 = vec3i(g1);
  if (airborne > 0.5 && p.vel.y < -0.3 && inGrid(g1)) {
    let others = countAt(c1) - select(0u, 1u, all(c1 == c0));
    if (others >= 3u) {
      let vl = vec3f(transfer1(g1 - vec3f(0.0, 0.5, 0.5), 0u, v.x).x,
                     transfer1(g1 - vec3f(0.5, 0.0, 0.5), 1u, v.y).x,
                     transfer1(g1 - vec3f(0.5, 0.5, 0.0), 2u, v.z).x);
      let dv = vl.y - p.vel.y;
      if (dv > 0.3) {
        v = vl;
        airborne = 0.0;
        atomicAdd(&C.impacts, 1u);
        let m = 998.0 * pow(0.5 * h, 3.0);
        let R = u32(P.misc.z);
        if (R > 0u) { depositRipple(x.xz, 2.0 * m * min(dv, 8.0), R); }
        // the liquid fills the bottom of the cell it lands in in proportion to the particles there
        let level = P.origin.y + (f32(c1.y) + min(f32(countAt(c1)) / P.phys2.x, 1.0)) * h;
        splashCrown(vec3f(x.x, level + 0.25 * h, x.z), -p.vel.y, m, id);
      }
    }
  }
  if (ing) { atomicMax(&C.vmax, bitcast<u32>(min(length(v), 60.0))); }
  if (ing && P.tank.y > 0.0) {
    let sp = length(v);
    if (sp > 0.75) {
      if (nearAir(c0)) {
        var s = hashU(id * 9781u + P.ext.w * 6271u + 17u);
        let e = clamp((sp - 0.75) / 1.6, 0.0, 1.0);
        if (rnd(&s) < P.tank.y * e * e * dt) {
          let k = atomicAdd(&C.wwCount, 1u);
          if (k < u32(P.tank.z)) {
            let j = vec3f(rnd(&s), rnd(&s), rnd(&s)) - vec3f(0.5);
            ww[k] = Particle(vec4f(x + j * h * 0.6, 1.0 + 2.5 * rnd(&s)), vec4f(v * (0.8 + 0.35 * rnd(&s)) + j * 0.35, 0.0));
          }
        }
      }
    }
  }
  parts[id] = Particle(vec4f(x, alive), vec4f(v, airborne));
}`;

// Emitters: 0 = disc outlet (stream/shower), 1 = sphere (drop/burst), 2 = jittered lattice (water block), 3 = rain area
const WGSL_EMIT = WGSL_SIM_COMMON + WGSL_COUNTERS + /* wgsl */`
struct Emit { a: vec4f, b: vec4f, c: vec4f, d: vec4f, info: vec4u };
@group(0) @binding(1) var<storage, read_write> parts: array<Particle>;
@group(0) @binding(2) var<storage, read_write> C: Counters;
@group(0) @binding(3) var<storage, read> E: array<Emit>;
@group(0) @binding(4) var<uniform> EI: vec4u;
` + WGSL_SDF(5) + /* wgsl */`
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let t = gid.x;
  if (t >= EI.y) { return; }
  var e = 0u;
  for (var i = 0u; i < EI.x; i++) { if (t >= E[i].info.x) { e = i; } }
  let em = E[e];
  let local = t - em.info.x;
  let idx = atomicLoad(&C.count) + t;
  if (idx >= P.ext.y) { return; }
  var s = hashU(t * 747796405u + em.info.z * 2891336453u + 1u);
  var pos = vec3f(0.0);
  var vel = vec3f(0.0);
  let shape = em.info.w;
  if (shape == 0u) {
    let rr = em.a.w * sqrt(rnd(&s));
    let th = 6.2831853 * rnd(&s);
    let u = em.c.xyz; let w = em.d.xyz; let dir = em.b.xyz;
    pos = em.a.xyz + (u * cos(th) + w * sin(th)) * rr + dir * (rnd(&s) * em.d.w);
    var dv = dir;
    if (em.c.w > 0.0) {
      let ca = 1.0 - rnd(&s) * (1.0 - cos(em.c.w));
      let sa = sqrt(max(1.0 - ca * ca, 0.0));
      let ph = 6.2831853 * rnd(&s);
      dv = dir * ca + (u * cos(ph) + w * sin(ph)) * sa;
    }
    vel = dv * em.b.w + (vec3f(rnd(&s), rnd(&s), rnd(&s)) - vec3f(0.5)) * (0.02 * em.b.w);
  } else if (shape == 1u) {
    var dd = vec3f(rnd(&s), rnd(&s), rnd(&s)) * 2.0 - vec3f(1.0);
    dd = normalize(dd + vec3f(1e-4));
    pos = em.a.xyz + dd * em.a.w * pow(rnd(&s), 0.3333);
    vel = em.b.xyz;
  } else if (shape == 2u) {
    let nx = u32(em.b.x); let ny = u32(em.b.y);
    let i = local % nx; let j = (local / nx) % ny; let k = local / (nx * ny);
    let jit = (vec3f(rnd(&s), rnd(&s), rnd(&s)) - vec3f(0.5)) * 0.3;
    pos = em.a.xyz + (vec3f(f32(i), f32(j), f32(k)) + vec3f(0.5) + jit) * em.a.w;
    vel = em.c.xyz;
  } else {
    pos = em.a.xyz + vec3f((rnd(&s) * 2.0 - 1.0) * em.a.w, -rnd(&s) * em.d.w, (rnd(&s) * 2.0 - 1.0) * em.a.w);
    vel = em.b.xyz;
  }
  var alive = 1.0;
  if (sceneSdf(pos) < 0.0) { alive = 0.0; }
  parts[idx] = Particle(vec4f(pos, alive), vec4f(vel, 0.0));
}`;

const WGSL_COMPACT = WGSL_SIM_COMMON + WGSL_COUNTERS + /* wgsl */`
@group(0) @binding(1) var<storage, read> src: array<Particle>;
@group(0) @binding(2) var<storage, read_write> dst: array<Particle>;
@group(0) @binding(3) var<storage, read_write> C: Counters;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let id = gid.x;
  if (id >= min(atomicLoad(&C.count), P.ext.y)) { return; }
  let p = src[id];
  if (p.pos.w < 0.5) { return; }
  let j = atomicAdd(&C.newCount, 1u);
  dst[j] = p;
}`;

// mode 0: refresh dispatch/draw arguments; 1: finish compaction; 2: commit U.y emitted particles;
// 3: finish whitewater compaction; 4: clear everything
const WGSL_COUNT = WGSL_SIM_COMMON + WGSL_COUNTERS + /* wgsl */`
@group(0) @binding(1) var<storage, read_write> C: Counters;
@group(0) @binding(2) var<storage, read_write> args: array<u32>;
@group(0) @binding(3) var<uniform> U: vec4u;
@compute @workgroup_size(1) fn main() {
  let cap = P.ext.y;
  let wcap = u32(P.tank.z);
  if (U.x == 1u) { atomicStore(&C.count, atomicLoad(&C.newCount)); atomicStore(&C.newCount, 0u); }
  if (U.x == 2u) { atomicStore(&C.count, min(atomicLoad(&C.count) + U.y, cap)); }
  if (U.x == 3u) { atomicStore(&C.wwCount, min(atomicLoad(&C.wwNew), wcap)); atomicStore(&C.wwNew, 0u); }
  if (U.x == 4u) { atomicStore(&C.count, 0u); atomicStore(&C.newCount, 0u); atomicStore(&C.wwCount, 0u); atomicStore(&C.wwNew, 0u); atomicStore(&C.impacts, 0u); }
  let n = min(atomicLoad(&C.count), cap);
  let w = min(atomicLoad(&C.wwCount), wcap);
  args[0] = (n + 255u) / 256u; args[1] = 1u; args[2] = 1u;
  args[3] = (w + 255u) / 256u; args[4] = 1u; args[5] = 1u;
  args[6] = 6u; args[7] = n; args[8] = 0u; args[9] = 0u;
  args[10] = 6u; args[11] = w; args[12] = 0u; args[13] = 0u;
}`;

// whitewater: spray in the air, foam on the surface, bubbles below it
const WGSL_WW = WGSL_SIM_COMMON + WGSL_COUNTERS + /* wgsl */`
@group(0) @binding(1) var<storage, read> src: array<Particle>;
@group(0) @binding(2) var<storage, read_write> dst: array<Particle>;
@group(0) @binding(3) var<storage, read_write> C: Counters;
@group(0) @binding(4) var<storage, read> vel: array<vec4f>;
@group(0) @binding(5) var<storage, read> cellCount: array<u32>;
@group(0) @binding(7) var<uniform> WU: vec4f;
@group(0) @binding(8) var<storage, read_write> rsrc: array<atomic<i32>>;
` + WGSL_SDF(6) + WGSL_SAMPLE + WGSL_TANK + /* wgsl */`
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) gid: vec3u) {
  let id = gid.x;
  if (id >= min(atomicLoad(&C.wwCount), u32(P.tank.z))) { return; }
  let p = src[id];
  var x = p.pos.xyz;
  var v = p.vel.xyz;
  var life = p.pos.w;
  let dt = WU.x;
  let g = gridPos(x);
  // under the surface layer: bubble; in a surface cell below the liquid level (the liquid fills the bottom of the
  // cell in proportion to its particles): foam; anywhere else: spray
  var kind = 0.0;
  if (inGrid(g)) {
    let c = vec3i(g);
    let n = cellCount[cellIdx(c.x, c.y, c.z)];
    if (n > 0u) {
      var up = 0u;
      if (c.y + 1 < NY()) { up = cellCount[cellIdx(c.x, c.y + 1, c.z)]; }
      if (up > 0u) { kind = 2.0; }
      else if (g.y - f32(c.y) < min(f32(n) / P.phys2.x, 1.0)) { kind = 1.0; }
    }
  }
  let R = u32(P.misc.z);
  if (p.vel.w < 0.5 && kind > 0.5 && R > 0u && p.vel.y < -0.3) {
    // spray droplet (about 1 mm) landing on the water
    let uv = (x.xz - fpMin()) / (fpMax() - fpMin());
    let ij = vec2u(clamp(round(uv * f32(R)), vec2f(0.0), vec2f(f32(R))));
    atomicAdd(&rsrc[ij.y * (R + 1u) + ij.x], i32(clamp(4.2e-6 * -p.vel.y, 0.0, 1e-4) * ${RIPPLE_SCALE.toExponential()}));
  }
  if (kind == 0.0) {
    v.y -= P.phys.y * dt;
    v *= 1.0 / (1.0 + 0.6 * dt);
    life -= dt * 0.7;
  } else {
    let vf = velNew(g);
    if (kind == 1.0) { v = vec3f(vf.x, 0.2 * vf.y, vf.z); life -= dt * 0.5; }
    else { v = vf + vec3f(0.0, 0.16, 0.0); life -= dt * 0.3; }
  }
  let x0 = x;
  x += v * dt;
  let d = sceneSdf(x);
  if (d < 0.0) { x -= sceneNormal(x) * d; }
  tankClamp(x0, &x, &v, 0.001);
  let outside = !inFootprint(x) && x.y < 0.001;
  if (life > 0.0 && !outside && x.y > -0.5 && !inDrain(x)) {
    let k = atomicAdd(&C.wwNew, 1u);
    if (k < u32(P.tank.z)) { dst[k] = Particle(vec4f(x, life), vec4f(v, kind)); }
  }
}`;

// Automated tests run in a headless browser whose WebGPU canvas presentation is unreliable; they set

const BU = GPUBufferUsage;
const TU = GPUTextureUsage;
function gbuf(size, usage, label) {
  return device.createBuffer({ size: Math.max(16, Math.ceil(size / 16) * 16), usage, label });
}
const pipeCache = new Map();
function computePipe(code, label) {
  const module = device.createShaderModule({ code, label });
  return device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' }, label });
}
function bindGroup(pipe, entries, label) {
  return device.createBindGroup({
    layout: pipe.getBindGroupLayout(0),
    entries: Object.entries(entries).map(([b, r]) => ({ binding: +b, resource: r instanceof GPUBuffer ? { buffer: r } : r })),
    label,
  });
}
function wgCount(n) { return Math.max(1, Math.ceil(n / 256)); }

// ============================================================
//  Liquid simulation driver
// ============================================================
const QUALITY = {
  low:      { label: '低', h: 0.012, cap: 140000, ww: 60000, iters: 28, pixel: 0.75, ripple: 128 },
  standard: { label: '標準', h: 0.0085, cap: 320000, ww: 140000, iters: 40, pixel: 1.0, ripple: 256 },
  high:     { label: '高', h: 0.0065, cap: 700000, ww: 260000, iters: 56, pixel: 1.0, ripple: 512 },
};
const MAX_OBJ = 64;
const MAX_EMIT = 48;
const G = 9.81;

const PIPES = {
  geom: computePipe(WGSL_GEOM, 'geom'),
  p2g: computePipe(WGSL_P2G, 'p2g'),
  normalize: computePipe(WGSL_NORMALIZE, 'normalize'),
  forces: computePipe(WGSL_FORCES, 'forces'),
  divergence: computePipe(WGSL_DIVERGENCE, 'divergence'),
  pressure: computePipe(WGSL_PRESSURE, 'pressure'),
  project: computePipe(WGSL_PROJECT, 'project'),
  g2p: computePipe(WGSL_G2P, 'g2p'),
  emit: computePipe(WGSL_EMIT, 'emit'),
  compact: computePipe(WGSL_COMPACT, 'compact'),
  count: computePipe(WGSL_COUNT, 'count'),
  ww: computePipe(WGSL_WW, 'ww'),
};

class FluidSim {
  constructor(tank, qualityKey) {
    const q = QUALITY[qualityKey];
    this.q = q;
    this.serial = FluidSim.serial = (FluidSim.serial || 0) + 1;
    this.h = q.h;
    this.nx = Math.max(8, Math.round(tank.w / q.h));
    this.ny = Math.max(8, Math.round(tank.h / q.h));
    this.nz = Math.max(8, Math.round(tank.d / q.h));
    this.h = Math.min(tank.w / this.nx, tank.h / this.ny, tank.d / this.nz);
    this.origin = [-this.nx * this.h / 2, 0, -this.nz * this.h / 2];
    this.rim = this.ny * this.h;
    this.nodes = (this.nx + 1) * (this.ny + 1) * (this.nz + 1);
    this.cells = this.nx * this.ny * this.nz;
    this.cap = q.cap;
    this.wwCap = q.ww;
    this.vp = Math.pow(this.h / 2, 3);           // volume carried by one particle
    this.radius = 0.5 * this.h * 1.05;           // rendering radius
    this.frame = 0;
    this.time = 0;
    this.vmax = 1.0;
    this.count = 0;
    this.wwCount = 0;
    this.impacts = 0;
    this.full = false;
    this.geomDirty = true;
    this.cur = 0;
    this.wwCur = 0;
    this.emitAcc = new Map();
    this.objCount = 0;

    const S = BU.STORAGE, D = BU.COPY_DST;
    this.params = gbuf(128, BU.UNIFORM | D, 'params');
    this.parity = [0, 1].map((p) => { const b = gbuf(16, BU.UNIFORM | D, 'parity'); device.queue.writeBuffer(b, 0, new Uint32Array([p, 0, 0, 0])); return b; });
    this.countU = [0, 1, 2, 3, 4].map((m) => { const b = gbuf(16, BU.UNIFORM | D, 'countMode'); device.queue.writeBuffer(b, 0, new Uint32Array([m, 0, 0, 0])); return b; });
    this.emitU = gbuf(16, BU.UNIFORM | D, 'emitInfo');
    this.wwU = gbuf(16, BU.UNIFORM | D, 'wwInfo');
    this.parts = [0, 1].map(() => gbuf(this.cap * 32, S | D, 'particles'));
    this.ww = [0, 1].map(() => gbuf(this.wwCap * 32, S | D, 'whitewater'));
    this.counters = gbuf(32, S | D | BU.COPY_SRC, 'counters');
    this.args = gbuf(64, S | BU.INDIRECT, 'args');
    this.acc = gbuf(this.nodes * 24, S | D, 'acc');
    this.cellCount = gbuf(this.cells * 4, S | D, 'cellCount');
    this.vel = gbuf(this.nodes * 16, S | D, 'vel');
    this.velOld = gbuf(this.nodes * 16, S, 'velOld');
    this.frac = gbuf(this.nodes * 16, S, 'frac');
    this.svel = gbuf(this.nodes * 16, S, 'svel');
    this.cellType = gbuf(this.cells * 4, S | D, 'cellType');
    this.divg = gbuf(this.cells * 4, S, 'divg');
    this.pres = gbuf(this.cells * 4, S | D, 'pres');
    this.objs = gbuf(MAX_OBJ * 112, S | D, 'objs');
    this.emits = gbuf(MAX_EMIT * 80, S | D, 'emits');
    this.staging = [0, 1, 2].map(() => ({ buf: device.createBuffer({ size: 32, usage: BU.MAP_READ | BU.COPY_DST }), busy: false }));
    this.stagingIdx = 0;
    this.ripple = new RippleLayer(q.ripple);
    this.ripple.bindMask(this.params, this.objs, topHView);
    this.buildBindGroups();
    this.writeParams(1 / 60);
    const enc = device.createCommandEncoder();
    this.encodeCount(enc, 4);
    device.queue.submit([enc.finish()]);
  }

  buildBindGroups() {
    const Pb = this.params;
    this.bg = {
      geom: bindGroup(PIPES.geom, { 0: Pb, 1: this.objs, 2: this.frac, 3: this.svel }),
      p2g: [0, 1].map((c) => bindGroup(PIPES.p2g, { 0: Pb, 1: this.parts[c], 2: this.counters, 3: this.acc, 4: this.cellCount })),
      normalize: bindGroup(PIPES.normalize, { 0: Pb, 1: this.acc, 2: this.vel, 3: this.velOld, 4: this.cellCount, 5: this.cellType }),
      forces: bindGroup(PIPES.forces, { 0: Pb, 1: this.vel, 2: this.frac, 3: this.svel }),
      divergence: bindGroup(PIPES.divergence, { 0: Pb, 1: this.vel, 2: this.frac, 3: this.svel, 4: this.cellType, 5: this.cellCount, 6: this.divg }),
      pressure: [0, 1].map((p) => bindGroup(PIPES.pressure, { 0: Pb, 1: this.frac, 2: this.cellType, 3: this.divg, 4: this.pres, 5: this.parity[p] })),
      project: bindGroup(PIPES.project, { 0: Pb, 1: this.vel, 2: this.frac, 3: this.svel, 4: this.cellType, 5: this.pres }),
      g2p: [0, 1].map((c) => [0, 1].map((w) => bindGroup(PIPES.g2p, { 0: Pb, 1: this.parts[c], 2: this.counters, 3: this.vel, 4: this.velOld, 5: this.objs, 6: this.cellCount, 7: this.ww[w], 8: this.ripple.src }))),
      emit: [0, 1].map((c) => bindGroup(PIPES.emit, { 0: Pb, 1: this.parts[c], 2: this.counters, 3: this.emits, 4: this.emitU, 5: this.objs })),
      compact: [0, 1].map((c) => bindGroup(PIPES.compact, { 0: Pb, 1: this.parts[c], 2: this.parts[1 - c], 3: this.counters })),
      count: this.countU.map((u) => bindGroup(PIPES.count, { 0: Pb, 1: this.counters, 2: this.args, 3: u })),
      ww: [0, 1].map((w) => bindGroup(PIPES.ww, { 0: Pb, 1: this.ww[w], 2: this.ww[1 - w], 3: this.counters, 4: this.vel, 5: this.cellCount, 6: this.objs, 7: this.wwU, 8: this.ripple.src })),
    };
  }

  destroy() {
    this.dead = true;
    for (const k of Object.keys(this)) { const b = this[k]; if (b instanceof GPUBuffer) b.destroy(); }
    for (const b of [...this.parts, ...this.ww, ...this.parity, ...this.countU, ...this.staging.map((st) => st.buf)]) b.destroy();
    this.ripple.destroy();
  }

  writeParams(dt) {
    const f = new Float32Array(32);
    const u = new Uint32Array(f.buffer);
    u[0] = this.nx; u[1] = this.ny; u[2] = this.nz; u[3] = this.nodes;
    u[4] = this.cells; u[5] = this.cap; u[6] = this.objCount; u[7] = this.frame;
    f[8] = this.origin[0]; f[9] = this.origin[1]; f[10] = this.origin[2]; f[11] = this.h;
    f[12] = dt; f[13] = G; f[14] = 0.96; f[15] = 1 / this.h;
    f[16] = 8; f[17] = 6.0; f[18] = 1.6; f[19] = 0.32 * this.h;
    f[20] = this.rim; f[21] = settings.whitewater ? 7.0 : 0.0; f[22] = this.wwCap; f[23] = 0.03;
    f[24] = this.time; f[25] = this.radius; f[26] = this.ripple.R; f[27] = 0;
    device.queue.writeBuffer(this.params, 0, f);
  }

  // obstacles and drains -> GPU objects; velocities from the previous transforms let moving obstacles push water
  setObjects(items, dtMove) {
    const data = new Float32Array(MAX_OBJ * 28);
    let n = 0;
    this.prevXf = this.prevXf || new Map();
    const nextXf = new Map();
    let moving = false;
    for (const it of items) {
      if (n >= MAX_OBJ) break;
      if (it.kind !== 'obstacle' && it.kind !== 'drain') continue;
      const R = it.kind === 'obstacle' ? obstacleRot(it) : m3.euler(it.rot[0], it.rot[1], it.rot[2]);
      const RT = m3.transpose(R);
      let type, d, flag, bound;
      if (it.kind === 'obstacle') {
        const sp = shapeParams(it);
        type = sp[0]; d = sp.slice(1); flag = 1; bound = boundRadius(it) + 0.002;
      } else {
        type = 9; d = [it.r, 0.012, 0, 0]; flag = 2; bound = it.r + 0.02;
      }
      let lin = [0, 0, 0], ang = [0, 0, 0];
      const prev = this.prevXf.get(it.id);
      if (prev && dtMove > 0) {
        lin = v3.mul(v3.sub(it.pos, prev.pos), 1 / dtMove);
        ang = v3.mul(m3.log(m3.mul(R, m3.transpose(prev.R))), 1 / dtMove);
        if (v3.len(lin) > 1e-5 || v3.len(ang) > 1e-4) moving = true;
        // clamp teleports (typed values) so they do not fling water
        if (v3.len(lin) > 4) lin = v3.mul(v3.norm(lin), 4);
        if (v3.len(ang) > 40) ang = v3.mul(v3.norm(ang), 40);
      }
      nextXf.set(it.id, { pos: [...it.pos], R });
      const o = n * 28;
      data.set([RT[0], RT[1], RT[2], 0, RT[3], RT[4], RT[5], 0, RT[6], RT[7], RT[8], 0], o);
      data.set([it.pos[0], it.pos[1], it.pos[2], type], o + 12);
      data.set([d[0], d[1], d[2], d[3]], o + 16);
      data.set([lin[0], lin[1], lin[2], bound], o + 20);
      data.set([ang[0], ang[1], ang[2], flag], o + 24);
      n++;
    }
    this.prevXf = nextXf;
    const sig = n + ':' + Array.prototype.join.call(data.subarray(0, n * 28), ',');
    if (sig !== this.objSig) {
      this.objSig = sig;
      this.objCount = n;
      device.queue.writeBuffer(this.objs, 0, data, 0, Math.max(n, 1) * 28);
      this.geomDirty = true;
    }
    return moving;
  }

  encodeCount(enc, mode) {
    const pass = enc.beginComputePass();
    pass.setPipeline(PIPES.count);
    pass.setBindGroup(0, this.bg.count[mode]);
    pass.dispatchWorkgroups(1);
    pass.end();
  }

  // emission list for one sub-step: [{shape, a, b, c, d, count}]
  writeEmits(list) {
    const f = new Float32Array(MAX_EMIT * 20);
    const u = new Uint32Array(f.buffer);
    let off = 0, k = 0;
    const room = Math.max(0, this.cap - this.count - 64);
    let budget = room;
    for (const e of list) {
      if (k >= MAX_EMIT || budget <= 0) break;
      const cnt = Math.min(e.count, budget);
      if (cnt <= 0) continue;
      const o = k * 20;
      f.set(e.a, o); f.set(e.b, o + 4); f.set(e.c || [0, 0, 0, 0], o + 8); f.set(e.d || [0, 0, 0, 0], o + 12);
      u[o + 16] = off; u[o + 17] = cnt; u[o + 18] = (Math.random() * 4294967295) >>> 0; u[o + 19] = e.shape;
      off += cnt; budget -= cnt; k++;
    }
    if (list.some((e) => e.count > 0) && budget <= 0) this.full = true;
    if (off > 0) {
      device.queue.writeBuffer(this.emits, 0, f, 0, k * 20);
      device.queue.writeBuffer(this.emitU, 0, new Uint32Array([k, off, 0, 0]));
      device.queue.writeBuffer(this.countU[2], 0, new Uint32Array([2, off, 0, 0]));
      this.count += off;
    }
    return off;
  }

  encodeEmit(enc, total) {
    const pass = enc.beginComputePass();
    pass.setPipeline(PIPES.emit);
    pass.setBindGroup(0, this.bg.emit[this.cur]);
    pass.dispatchWorkgroups(wgCount(total));
    pass.end();
    this.encodeCount(enc, 2);
  }

  encodeSubstep(enc) {
    enc.clearBuffer(this.acc);
    enc.clearBuffer(this.cellCount);
    const pass = enc.beginComputePass();
    const nodeWG = wgCount(this.nodes), cellWG = wgCount(this.cells);
    if (this.geomDirty) {
      pass.setPipeline(PIPES.geom); pass.setBindGroup(0, this.bg.geom); pass.dispatchWorkgroups(nodeWG);
      this.geomDirty = false;
    }
    pass.setPipeline(PIPES.p2g); pass.setBindGroup(0, this.bg.p2g[this.cur]); pass.dispatchWorkgroupsIndirect(this.args, 0);
    pass.setPipeline(PIPES.normalize); pass.setBindGroup(0, this.bg.normalize); pass.dispatchWorkgroups(nodeWG);
    pass.setPipeline(PIPES.forces); pass.setBindGroup(0, this.bg.forces); pass.dispatchWorkgroups(nodeWG);
    pass.setPipeline(PIPES.divergence); pass.setBindGroup(0, this.bg.divergence); pass.dispatchWorkgroups(cellWG);
    pass.setPipeline(PIPES.pressure);
    for (let i = 0; i < this.q.iters; i++) {
      pass.setBindGroup(0, this.bg.pressure[0]); pass.dispatchWorkgroups(cellWG);
      pass.setBindGroup(0, this.bg.pressure[1]); pass.dispatchWorkgroups(cellWG);
    }
    pass.setPipeline(PIPES.project); pass.setBindGroup(0, this.bg.project); pass.dispatchWorkgroups(nodeWG);
    pass.setPipeline(PIPES.g2p); pass.setBindGroup(0, this.bg.g2p[this.cur][this.wwCur]); pass.dispatchWorkgroupsIndirect(this.args, 0);
    pass.end();
  }

  // advances the liquid by frameDt seconds; emitFn(dt, tSub) returns the emission list for each sub-step
  step(frameDt, emitFn) {
    if (frameDt <= 0) return;
    const vmax = Math.max(this.vmax, 0.4);
    let n = Math.ceil(frameDt / (1.4 * this.h / vmax));
    n = clamp(n, 1, 6);
    const dt = frameDt / n;
    device.queue.writeBuffer(this.counters, 16, new Uint32Array([0]));
    for (let s = 0; s < n; s++) {
      this.frame++;
      this.writeParams(dt);
      const list = emitFn ? emitFn(this, dt, this.time) : [];
      const total = this.writeEmits(list);
      const enc = device.createCommandEncoder();
      if (total > 0) this.encodeEmit(enc, total);
      this.encodeCount(enc, 0);
      this.encodeSubstep(enc);
      device.queue.submit([enc.finish()]);
      this.time += dt;
    }
    // remove drained particles, advance whitewater
    device.queue.writeBuffer(this.wwU, 0, new Float32Array([frameDt, 0, 0, 0]));
    const enc = device.createCommandEncoder();
    let pass = enc.beginComputePass();
    pass.setPipeline(PIPES.compact); pass.setBindGroup(0, this.bg.compact[this.cur]); pass.dispatchWorkgroupsIndirect(this.args, 0);
    pass.end();
    this.cur = 1 - this.cur;
    this.encodeCount(enc, 1);
    pass = enc.beginComputePass();
    pass.setPipeline(PIPES.ww); pass.setBindGroup(0, this.bg.ww[this.wwCur]); pass.dispatchWorkgroupsIndirect(this.args, 12);
    pass.end();
    this.wwCur = 1 - this.wwCur;
    this.encodeCount(enc, 3);
    const meanDepth = clamp(this.waterLiters / 1000 / (this.nx * this.nz * this.h * this.h), 0.003, this.rim);
    this.ripple.encodeFrame(enc, frameDt, { w: this.nx * this.h, d: this.nz * this.h }, meanDepth, this.h);
    this.readStats(enc);
    device.queue.submit([enc.finish()]);
  }

  readStats(enc) {
    const st = this.staging[this.stagingIdx];
    if (st.busy) return;
    this.stagingIdx = (this.stagingIdx + 1) % this.staging.length;
    enc.copyBufferToBuffer(this.counters, 0, st.buf, 0, 32);
    st.busy = true;
    st.pending = true;
  }
  pollStats() {
    for (const st of this.staging) {
      if (!st.pending) continue;
      st.pending = false;
      st.buf.mapAsync(GPUMapMode.READ).then(() => {
        const u = new Uint32Array(st.buf.getMappedRange().slice(0));
        st.buf.unmap();
        st.busy = false;
        if (this.dead) return;
        this.count = u[0];
        this.impacts = u[5];
        this.wwCount = Math.min(u[2], this.wwCap);
        const vm = new Float32Array(new Uint32Array([u[4]]).buffer)[0];
        if (Number.isFinite(vm)) this.vmax = vm;
        if (this.count < this.cap * 0.9) this.full = false;
      }).catch(() => { st.busy = false; });
    }
  }

  clearWater() {
    const enc = device.createCommandEncoder();
    this.encodeCount(enc, 4);
    enc.clearBuffer(this.pres);
    device.queue.submit([enc.finish()]);
    this.ripple.clear();
    this.count = 0; this.wwCount = 0; this.impacts = 0; this.full = false; this.time = 0; this.vmax = 1;
    this.emitAcc.clear();
  }

  get waterLiters() { return this.count * this.vp * 1000; }
}

// ---- 55-emit.js
// ============================================================
//  Turning water sources and blocks into particle emissions
// ============================================================
function basisOf(dir) {
  const ref = Math.abs(dir[1]) < 0.95 ? [0, 1, 0] : [1, 0, 0];
  const u = v3.norm(v3.cross(dir, ref));
  const w = v3.cross(dir, u);
  return [u, w];
}
const RAIN_SPEED = 6.5;

// emissions for one sub-step of length dt starting at simulation time t
function sourceEmits(sim, dt, t) {
  const list = [];
  const Vp = sim.vp;
  for (const src of scene.items) {
    if (src.kind !== 'source' || !src.enabled) continue;
    let st = sim.emitAcc.get(src.id);
    if (!st) { st = { acc: 0, liters: 0, timer: 0, fired: false }; sim.emitAcc.set(src.id, st); }
    if (src.total > 0 && st.liters >= src.total) continue;
    const dir = sourceDir(src);
    const [u, w] = basisOf(dir);
    const add = (e, liters) => { list.push(e); st.liters += liters; };
    if (src.mode === 'stream' || src.mode === 'shower') {
      const Q = src.flow / 60000;
      st.acc += (Q * dt) / Vp;
      const n = Math.floor(st.acc);
      st.acc -= n;
      if (n <= 0) continue;
      const shower = src.mode === 'shower';
      const r = shower ? Math.max(sourceNozzle(src) / 2, 0.022) : Math.max(sourceNozzle(src) / 2, 0.0005);
      const spread = shower ? clamp(src.spread, 0, 80) * DEG : 0;
      // the outlet sits a little in front of the nozzle so particles never start inside it
      const p = v3.add(src.pos, v3.mul(dir, 0.002));
      add({ shape: 0, a: [...p, r], b: [...dir, src.speed], c: [...u, spread], d: [...w, src.speed * dt], count: n }, n * Vp * 1000);
    } else if (src.mode === 'drops') {
      st.timer -= dt;
      if (st.timer > 0) continue;
      st.timer += 1 / clamp(src.dropRate, 0.05, 60);
      if (st.timer < 0) st.timer = 0;
      const d = clamp(src.dropD, 1, 40) / 1000;
      const V = Math.PI / 6 * d * d * d;
      const n = Math.max(1, Math.round(V / Vp));
      const R = Math.max(d / 2, Math.cbrt((3 * n * Vp) / (4 * Math.PI)) * 0.9);
      const p = v3.add(src.pos, v3.mul(dir, R + 0.002));
      add({ shape: 1, a: [...p, n === 1 ? 0 : R], b: [...v3.mul(dir, src.speed), 0], count: n }, n * Vp * 1000);
    } else if (src.mode === 'burst') {
      if (st.fired) {
        if (!(src.burstEvery > 0)) continue;
        st.timer -= dt;
        if (st.timer > 0) continue;
      }
      st.fired = true;
      st.timer = src.burstEvery > 0 ? src.burstEvery : 0;
      const V = clamp(src.burst, 0.01, 50) / 1000;
      const n = Math.max(1, Math.round(V / Vp));
      const R = Math.cbrt((3 * V) / (4 * Math.PI));
      const p = v3.add(src.pos, v3.mul(dir, R + 0.004));
      add({ shape: 1, a: [...p, R], b: [...v3.mul(dir, src.speed), 0], count: n }, n * Vp * 1000);
    } else if (src.mode === 'rain') {
      const side = clamp(src.rainSize, 0.05, 2);
      const flux = (clamp(src.rainRate, 1, 500) / 3.6e6) * side * side;
      st.acc += (flux * dt) / Vp;
      const n = Math.floor(st.acc);
      st.acc -= n;
      if (n <= 0) continue;
      add({ shape: 3, a: [...src.pos, side / 2], b: [0, -RAIN_SPEED, 0, 0], d: [0, 0, 0, RAIN_SPEED * dt], count: n }, n * Vp * 1000);
    }
  }
  return list;
}

// lattice fills for the water blocks (used when the simulation is reset)
function blockEmits(sim) {
  const list = [];
  const sp = sim.h / 2;
  for (const b of scene.items) {
    if (b.kind !== 'block') continue;
    const lo = [b.pos[0] - b.dims.w / 2, b.pos[1] - b.dims.h / 2, b.pos[2] - b.dims.d / 2];
    const hi = [b.pos[0] + b.dims.w / 2, b.pos[1] + b.dims.h / 2, b.pos[2] + b.dims.d / 2];
    // clip to the inside of the tank
    const tlo = [sim.origin[0] + sp * 0.5, 0.0005, sim.origin[2] + sp * 0.5];
    const thi = [-sim.origin[0] - sp * 0.5, Infinity, -sim.origin[2] - sp * 0.5];
    const insideX = lo[0] < thi[0] && hi[0] > tlo[0] && lo[2] < thi[2] && hi[2] > tlo[2];
    if (insideX) {
      for (const k of [0, 2]) { lo[k] = Math.max(lo[k], tlo[k]); hi[k] = Math.min(hi[k], thi[k]); }
      lo[1] = Math.max(lo[1], tlo[1]);
    }
    const n = [0, 1, 2].map((k) => Math.max(0, Math.floor((hi[k] - lo[k]) / sp)));
    const total = n[0] * n[1] * n[2];
    if (total <= 0) continue;
    // centre the lattice inside the clipped box
    const start = [0, 1, 2].map((k) => lo[k] + ((hi[k] - lo[k]) - n[k] * sp) / 2);
    list.push({ shape: 2, a: [...start, sp], b: [n[0], n[1], n[2], 0], c: [0, 0, 0, 0], count: total });
  }
  return list;
}

const WGSL_FRAME = /* wgsl */`
struct Frame {
  vp: mat4x4f, invVp: mat4x4f, view: mat4x4f, proj: mat4x4f, shadowVp: mat4x4f,
  eye: vec4f,       // camera position, pixel angle
  sunDir: vec4f,    // direction to the sun, sun disc radiance
  sunColor: vec4f,  // irradiance, exposure
  skyIrr: vec4f,    // sky irradiance on an upward surface, time
  screen: vec4f,    // width, height, 1/width, 1/height
  proj2: vec4f,     // P00, P11, near, far
  tank: vec4f,      // half width, height, half depth, glass thickness
  water: vec4f,     // absorption rgb, particle radius
  camRight: vec4f, camUp: vec4f, camBack: vec4f,
  misc: vec4f,      // focal length in px, whitewater on, unused, unused
  wmap: vec4f,      // top-view water map: x min, z min, width, depth
  wmap2: vec4f,     // sunlight direction after refraction by flat water, unused
};
const PI: f32 = 3.14159265;
fn fresnelW(c: f32) -> f32 { let x = clamp(1.0 - c, 0.0, 1.0); return 0.0204 + 0.9796 * x * x * x * x * x; }
fn linDepth(d: f32) -> f32 { let n = F.proj2.z; let f = F.proj2.w; return n * f / (d * (n - f) + f); }
fn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2f(1.0, 0.0)), u.x), mix(hash12(i + vec2f(0.0, 1.0)), hash12(i + vec2f(1.0, 1.0)), u.x), u.y);
}
fn fbm(p0: vec2f) -> f32 { var p = p0; var s = 0.0; var a = 0.5; for (var i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; } return s; }
fn ggxSpec(n: vec3f, v: vec3f, l: vec3f, a: f32, f0: vec3f) -> vec3f {
  let nl = dot(n, l);
  if (nl <= 0.0) { return vec3f(0.0); }
  let h = normalize(l + v);
  let nv = max(dot(n, v), 1e-3); let nh = max(dot(n, h), 0.0); let vh = max(dot(v, h), 0.0);
  let a2 = a * a;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let k = a * 0.5;
  let Gs = (nl / (nl * (1.0 - k) + k)) * (nv / (nv * (1.0 - k) + k));
  let Fr = f0 + (vec3f(1.0) - f0) * pow(1.0 - vh, 5.0);
  return Fr * (D * Gs / (4.0 * nv));
}
`;

const WGSL_SKYBAKE = /* wgsl */`
@group(0) @binding(0) var outTex: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(1) var<uniform> S: vec4f;

    let n = fbm(p * 1.1 + vec2f(4.0, 7.0));
    let cov = smoothstep(0.5, 0.78, n) * smoothstep(0.0, 0.1, d.y);
    let sh = fbm(p * 1.1 + vec2f(4.0, 7.0) + sun.xz * 0.15);

const WGSL_MIP = /* wgsl */`
@group(0) @binding(0) var src: texture_2d_array<f32>;

const WGSL_SCENE_BINDINGS = /* wgsl */`
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var skyTex: texture_cube<f32>;
@group(0) @binding(3) var shadowMap: texture_depth_2d;
@group(0) @binding(4) var shadowSamp: sampler_comparison;
@group(0) @binding(5) var topH: texture_2d<f32>;
@group(0) @binding(6) var causticTex: texture_2d<f32>;
fn waterTop(xz: vec2f) -> f32 {
  let uv = (xz - F.wmap.xy) / F.wmap.zw;
  if (any(uv < vec2f(0.0)) || any(uv >= vec2f(1.0))) { return -1.0; }
  let dims = vec2f(textureDimensions(topH));
  return textureLoad(topH, vec2i(uv * dims), 0).r;
}
// sunlight factor and colour change for a point that may lie under the water surface
fn underwaterSun(wp: vec3f) -> vec3f {
  let h = waterTop(wp.xz);
  if (h < 0.0 || wp.y > h - 0.0005) { return vec3f(1.0); }
  let uv = (wp.xz - F.wmap.xy) / F.wmap.zw;
  let c = textureSampleLevel(causticTex, samp, uv, 0.0).r;
  let path = (h - wp.y) / max(-F.wmap2.y, 0.2);
  return c * exp(-F.water.rgb * path);
}
fn underwaterAmb(wp: vec3f) -> vec3f {
  let h = waterTop(wp.xz);
  if (h < 0.0 || wp.y > h) { return vec3f(1.0); }
  return 0.9 * exp(-F.water.rgb * (h - wp.y) * 1.5);
}
fn shadowAt(wp: vec3f, n: vec3f) -> f32 {

  let uv = vec2f(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5);
  if (any(uv < vec2f(0.0)) || any(uv > vec2f(1.0)) || p.z > 1.0) { return 1.0; }
  let texel = 1.0 / f32(textureDimensions(shadowMap).x);
