fn ambientIrr(n: vec3f) -> vec3f {
  let ground = vec3f(0.30, 0.29, 0.27) * (F.sunColor.rgb * F.sunDir.y + F.skyIrr.rgb) / PI;
  return mix(ground, F.skyIrr.rgb, clamp(n.y * 0.5 + 0.5, 0.0, 1.0));
}
`;

const WGSL_SOLID = WGSL_FRAME + WGSL_SCENE_BINDINGS + /* wgsl */`
struct ObjU { model: mat4x4f, color: vec4f, mat: vec4f };

@vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f) -> VO {

  var o: VO;
  o.pos = F.vp * w;
  o.wp = w.xyz;
  o.n = (O.model * vec4f(n, 0.0)).xyz;
  o.lp = p;
  return o;

@vertex fn vsShadow(@location(0) p: vec3f, @location(1) n: vec3f) -> @builtin(position) vec4f {

}
// large stone floor tiles with grout lines
fn floorTiles(p: vec2f, fp: f32) -> vec3f {
  let T = 0.2;
  let g = p / T;
  let cell = floor(g);
  let e = min(fract(g), 1.0 - fract(g)) * T;
  let d = min(e.x, e.y);
  let w = max(fp, 2e-4);
  let grout = (1.0 - smoothstep(0.0025 - w, 0.0025 + w, d)) * (1.0 - smoothstep(0.004, 0.02, fp));
  let h = hash12(cell);
  let n = fbm(p * 7.0 + h * 13.0);

  let base = mix(vec3f(0.46, 0.45, 0.43), vec3f(0.60, 0.59, 0.56), h) * (0.84 + 0.26 * n + 0.08 * (fine - 0.5));
  return mix(base, vec3f(0.24, 0.24, 0.23), grout);
}
@fragment fn fs(in: VO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  var n = normalize(in.n);
  if (!ff) { n = -n; }
  let Vv = F.eye.xyz - in.wp;
  let dist = length(Vv);
  let V = Vv / dist;
  var alb = O.color.rgb;
  var rough = O.mat.x;
  let metal = O.mat.y;
  let kind = O.mat.z;
  if (kind > 1.5 && kind < 2.5) {

  let uw = underwaterSun(in.wp);
  let ua = underwaterAmb(in.wp);

  let nl = max(dot(n, L), 0.0);

  col += kd * alb * ambientIrr(n) / PI * 0.95 * ua;
  let R = reflect(-V, n);
  col += skyL(R, rough * 7.0) * Fa * mix(0.55, 1.0, sh) * (1.0 - 0.6 * f32(kind > 1.5 && kind < 2.5));
  if (kind > 1.5 && kind < 2.5) { col = mix(col, vec3f(0.42, 0.52, 0.64), 1.0 - exp(-dist * 0.04)); }
  col += O.color.rgb * O.mat.w;
  return vec4f(col, 1.0);
}`;

const WGSL_PARTICLE_VS = /* wgsl */`

const WGSL_PDEPTH = WGSL_FRAME + WGSL_PARTICLE_VS + /* wgsl */`
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {

fn hit(in: VO) -> vec3f {

  let disc = b * b - (dot(in.vc, in.vc) - in.r * in.r);

  let z = -(normalize(in.q) * h.x).z;
  let zs = linDepth(textureLoad(sceneDepth, vec2i(in.pos.xy), 0));

// whitewater sprites, attenuated when they sit below the liquid surface
const WGSL_WWDRAW = WGSL_FRAME + WGSL_PARTICLE_VS + /* wgsl */`

  let p = parts[ii];
  let kind = p.vel.w;
  var r = 0.0011;
  if (kind > 0.5 && kind < 1.5) { r = 0.0016; }
  if (kind > 1.5) { r = 0.0010; }

// narrow-range depth filter: farther samples are clamped, nearer ones ignored
const WGSL_SMOOTH = WGSL_FRAME + /* wgsl */`
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var inTex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> D: vec4f;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let p = vec2i(fc.xy);
  let sz = vec2i(textureDimensions(inTex)) - vec2i(1);
  let z = textureLoad(inTex, p, 0).r;
  if (z <= 0.0) { return vec4f(0.0); }
  let r = F.water.w;
  let rpx = r * F.misc.x / z;
  let sig = clamp(rpx * 1.2, 1.0, 16.0);
  let R = i32(min(ceil(sig * 2.0), 32.0));
  let mu = r * 1.6;
  let dir = vec2i(i32(D.x), i32(D.y));
  var sum = 0.0;
  var ws = 0.0;
  for (var i = -32; i <= 32; i++) {
    if (i < -R || i > R) { continue; }
    let q = clamp(p + dir * i, vec2i(0), sz);
    var zq = textureLoad(inTex, q, 0).r;
    if (zq <= 0.0) { continue; }
    if (zq < z - mu) { continue; }
    zq = min(zq, z + mu);
    let w = exp(-f32(i * i) / (2.0 * sig * sig));
    sum += zq * w;
    ws += w;
  }
  return vec4f(sum / ws, 0.0, 0.0, 1.0);
}`;

const WGSL_COMPOSITE = WGSL_FRAME + WGSL_SCENE_BINDINGS + /* wgsl */`

// ---------- undo ----------

}

  const o = JSON.parse(s);

  scene.tank = o.scene.tank;
  scene.items = o.scene.items;
  uid = Math.max(uid, ...scene.items.map((i) => i.id + 1));
  selectedId = o.selectedId && (o.selectedId === 'tank' || getItem(o.selectedId)) ? o.selectedId : null;
  lastSnapshot = s;

// ---------- number fields (drag to scrub, click to type) ----------
function numberField({ get, set, unit = '', scale = 1, digits = 1, step = 0.1, min = -Infinity, max = Infinity, axis = null, prefix = null, zeroText = null, label, fill = null }) {
  const el = document.createElement('div');
  el.className = 'nf';
  el.tabIndex = 0;
  el.setAttribute('role', 'spinbutton');
  if (label) el.setAttribute('aria-label', label);
  el.innerHTML = (fill ? '<span class="fill"></span>' : '') + (axis ? `<span class="ax ${axis}">${axis.toUpperCase()}</span>` : '') + (prefix ? '<span class="ax pre"></span>' : '') + '<span class="val"></span>';
  if (prefix) el.querySelector('.pre').textContent = prefix;
  const val = el.querySelector('.val');
  const fmt = (v) => (zeroText && Math.abs(v) < 1e-9 ? zeroText : (v * scale).toFixed(digits) + (unit ? ' ' + unit : ''));
  const render = () => {
    const v = get();
    val.textContent = fmt(v);
    el.setAttribute('aria-valuenow', (v * scale).toFixed(digits));
    if (fill) el.querySelector('.fill').style.width = `${clamp((v - fill[0]) / (fill[1] - fill[0]), 0, 1) * 100}%`;
  };
  const apply = (v) => { set(clamp(v, min, max)); render(); };
  let start = null;
  el.addEventListener('pointerdown', (e) => {
    if (el.querySelector('input')) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    start = { x: e.clientX, v: get(), moved: false };
    el.classList.add('focus');
  });
  el.addEventListener('pointermove', (e) => {
    if (!start) return;
    const dx = e.clientX - start.x;
    if (!start.moved && Math.abs(dx) < 3) return;
    start.moved = true;
    const k = e.shiftKey ? 0.1 : 1;
    let v = start.v + (dx / 4) * (step / scale) * k;
    if (e.ctrlKey) v = Math.round(v / (step / scale * 10)) * (step / scale * 10);
    apply(v);
  });
  const up = () => {
    if (!start) return;
    const moved = start.moved;
    start = null;
    el.classList.remove('focus');
    if (moved) pushUndo(); else edit();
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', () => { start = null; el.classList.remove('focus'); });
  function edit() {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.value = (get() * scale).toFixed(digits);
    el.appendChild(inp);
    inp.focus();
    inp.select();
    let done = false;
    const finish = (ok) => {
      if (done) return;
      done = true;
      if (ok) {
        const n = parseFloat(inp.value.replace(/[^0-9.+\-eE]/g, ''));
        if (Number.isFinite(n)) { apply(n / scale); pushUndo(); }
      }
      inp.remove();
      render();
    };
    inp.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') { finish(true); el.focus(); }
      else if (e.key === 'Escape') { finish(false); el.focus(); }
    });
    inp.addEventListener('blur', () => finish(true));
  }
  el.addEventListener('keydown', (e) => {
    if (el.querySelector('input')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); edit(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); apply(get() + (step / scale) * (e.shiftKey ? 10 : 1)); pushUndo(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); apply(get() - (step / scale) * (e.shiftKey ? 10 : 1)); pushUndo(); }
  });
  render();
  el.refresh = render;
  return el;
}
function row(labelText, control) {
  const r = document.createElement('div');
  r.className = 'prow';
  const l = document.createElement('span');
  l.className = 'lbl';
  l.textContent = labelText;
  r.append(l, control);
  return r;
}
function group(title, ...rows) {
  const g = document.createElement('div');
  g.className = 'pgroup';
  if (title) { const h = document.createElement('h3'); h.textContent = title; g.appendChild(h); }
  g.append(...rows.filter(Boolean));
  return g;
}
function trio(fields) { const d = document.createElement('div'); d.className = 'trio'; d.append(...fields); return d; }
function segmented(options, get, set, label) {
  const d = document.createElement('div');
  d.className = 'seg';
  d.setAttribute('role', 'radiogroup');
  if (label) d.setAttribute('aria-label', label);
  for (const [k, text] of options) {

    b.setAttribute('aria-checked', String(get() === k));
    b.addEventListener('click', () => { set(k); pushUndo(); refreshPanels(); });
    d.appendChild(b);

}
function toggle(get, set, label) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'toggle';
  b.setAttribute('role', 'switch');
  b.setAttribute('aria-checked', String(get()));
  b.innerHTML = '<span class="sw"></span><span></span>';
  b.lastChild.textContent = label;
  b.addEventListener('click', () => { set(!get()); b.setAttribute('aria-checked', String(get())); pushUndo(); refreshPanels(); });

}
const CM = { unit: 'cm', scale: 100, digits: 1, step: 0.5 };
const liveFields = [];
function posFields(it) {

function rotFields(it) {

// keyboard (Blender-like)
let lastPointer = null;

window.addEventListener('keydown', (e) => {
  const tgt = e.target;
  if (tgt instanceof HTMLInputElement || tgt instanceof HTMLTextAreaElement) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey) return;
  if (editor.modal) {
    if (k === 'Escape') { endModal(false); e.preventDefault(); }
    else if (k === 'Enter') { endModal(true); e.preventDefault(); }
    else if ('xyzXYZ'.includes(k) && k.length === 1) {
      const a = 'xyz'.indexOf(k.toLowerCase());
      editor.modal.axis = editor.modal.axis === a ? -1 : a;
      if (editor.modal.lastX !== undefined) updateModal(editor.modal.lastX, editor.modal.lastY, e.shiftKey);
    }
    return;
  }
  if (tgt instanceof HTMLButtonElement && (k === ' ' || k === 'Enter')) return;
  if (k === ' ') { e.preventDefault(); setPlaying(!settings.playing); }
  else if (k === 'A' && e.shiftKey) { e.preventDefault(); $('m-add').click(); }
  else if ((k === 'D' || k === 'd') && e.shiftKey) { e.preventDefault(); duplicateSelected(true); }
  else if (k === 'g' || k === 'G') { if (lastPointer) startModal('move', lastPointer[0], lastPointer[1]); }
  else if (k === 'r' || k === 'R') { if (lastPointer) startModal('rotate', lastPointer[0], lastPointer[1]); }
  else if (k === 's' || k === 'S') { if (lastPointer) startModal('scale', lastPointer[0], lastPointer[1]); }
  else if (k === 'x' || k === 'X' || k === 'Delete' || k === 'Backspace') { if (selected()) { e.preventDefault(); deleteSelected(); } }
  else if (k === 'Escape') { closeMenus(); select(null); }
  else if (k === 'Home') { animateCamera({ ...frameAll(), ...VIEW_PRESETS.home }); }
  else if (k === '1') animateCamera({ ...VIEW_PRESETS.front, ...frameAll() });
  else if (k === '3') animateCamera({ ...VIEW_PRESETS.side, ...frameAll() });
  else if (k === '7') animateCamera({ ...VIEW_PRESETS.top, ...frameAll() });
  else if (k === '.') focusSelected();
  else if (k === 'ArrowRight' && !settings.playing) stepRequests++;
  else if (k === 'w' || k === 'W') setTool('move');
  else if (k === 'e' || k === 'E') setTool('rotate');
});

// ============================================================
//  Main loop and start-up
// ============================================================
let sim = null;
FluidSim.prototype.emitNow = function (list) {
  for (let i = 0; i < list.length; i += MAX_EMIT) {
    const total = this.writeEmits(list.slice(i, i + MAX_EMIT));
    if (!total) continue;
    const enc = device.createCommandEncoder();
    this.encodeEmit(enc, total);
    device.queue.submit([enc.finish()]);
  }
};
function rebuildSim(refill) {
  if (sim) sim.destroy();
  sim = new FluidSim(scene.tank, settings.quality);
  sim.setObjects(scene.items, 0);
  if (refill) sim.emitNow(blockEmits(sim));
  pBGCache.key = null;
  refreshPanels();
}
function resetSim() {
  sim.clearWater();
  sim.setObjects(scene.items, 0);
  sim.emitNow(blockEmits(sim));
  toast('最初の状態に戻しました', 1400);
}

// ---------- sizing ----------
let resizePending = true;
new ResizeObserver(() => { resizePending = true; }).observe($('view'));
function doResize() {
  resizePending = false;
  const r = $('view').getBoundingClientRect();
  cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = QUALITY[settings.quality].pixel * Math.min(dpr, settings.quality === 'high' ? 2 : 1.5);
  const w = Math.max(16, Math.round(cssW * s)), h = Math.max(16, Math.round(cssH * s));
  if (RT && RT.w === w && RT.h === h) return;
  gpuCanvas.width = w; gpuCanvas.height = h;
  buildTargets(w, h);
  pBGCache.key = null;
}

// ---------- loop ----------
let last = performance.now();
const perf = { t: 0, frames: 0, shown: 0, acc: 0, n: 0, checked: false, touched: false };
function updateStats(realDt) {
  perf.acc += realDt; perf.n++;
  perf.shown += realDt;
  if (perf.shown < 0.25) return;
  const fps = perf.n / perf.acc;
  perf.shown = 0; perf.acc = 0; perf.n = 0;
  $('t-time').textContent = sim.time.toFixed(2) + ' s';
  $('t-water').textContent = sim.waterLiters.toFixed(2) + ' L';
  const ratio = sim.count / sim.cap;
  const meter = $('t-meter');
  meter.firstChild.style.width = `${Math.min(ratio, 1) * 100}%`;
  meter.classList.toggle('full', ratio > 0.9);
  $('t-fps').textContent = Number.isFinite(fps) ? Math.round(fps) + ' fps' : '--';
  const st = $('status');
  if (sim.full) { st.hidden = false; st.innerHTML = '<b>水の量が上限です。</b>排水口を置くか、水槽の設定で水を消してください。'; }
  else if (editor.modal) st.hidden = true;
  else st.hidden = true;
  liveRefresh();
}
// the solver only advances once the GPU has finished its previous step, so slow devices never build a backlog
let simBusy = false;
let frameCount = 0;
let holdRender = !!window.__holdRenderAtBoot;
function frame(now) {
  frameCount++;
  const realDt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  stepCameraAnim(realDt);
  if (resizePending) doResize();
  let simDt = settings.playing ? realDt * settings.speed : 0;
  if (!settings.playing && stepRequests > 0) { simDt = (stepRequests * settings.speed) / 60; stepRequests = 0; }
  if (simBusy) simDt = 0;
  sim.setObjects(scene.items, simDt);
  if (simDt > 0) {
    sim.step(simDt, sourceEmits);
    simBusy = true;
    device.queue.onSubmittedWorkDone().then(() => { simBusy = false; }, () => { simBusy = false; });
  }
  sim.pollStats();
  if (panelsDirty) { panelsDirty = false; buildOutliner(); buildProps(); }
  // the test presentation path paces itself on its own readback; the WebGPU canvas is paced by the browser
  if (!holdRender && !(offscreenPresent && present.busy)) drawFrame(sim, drawOverlay);
  updateStats(realDt);
  if (!perf.checked) {
    perf.t += realDt; perf.frames++;
    if (perf.t > 5) {
      perf.checked = true;
      if (perf.t / perf.frames > 0.06 && settings.quality !== 'low' && !perf.touched) {
        settings.quality = 'low';
        rebuildSim(true);
        toast('動作が重いため、計算の細かさを「低」にしました（表示メニューで変えられます）', 4200);
      }
    }
  }
  requestAnimationFrame(frame);
}
for (const ev of ['pointerdown', 'keydown', 'wheel']) window.addEventListener(ev, () => { perf.touched = true; }, { once: true, capture: true });

// ---------- start ----------
(() => {
  let loaded = false;
  const saved = store.get('suiri-lab-scene');
  if (saved) {
    try {
      const o = JSON.parse(saved);
      if (o && o.v === 1 && o.scene && Array.isArray(o.scene.items) && o.scene.tank) {
        scene.tank = o.scene.tank;
        scene.items = o.scene.items;
        uid = Math.max(1, ...scene.items.map((i) => (i.id | 0) + 1));
        if (o.cam) Object.assign(cam, o.cam);
        loaded = true;
      }
    } catch (e) { loaded = false; }
  }
  if (!loaded) {
    const s = PRESETS[0].make();
    scene.tank = s.tank; scene.items = s.items;
    const vr = $('view').getBoundingClientRect();
    cssW = vr.width; cssH = vr.height;
    Object.assign(cam, frameAll(), VIEW_PRESETS.home);
  }
  const narrow = window.matchMedia('(max-width: 820px)').matches;
  const hashQ = location.hash.slice(1);
  settings.quality = QUALITY[hashQ] ? hashQ : isCoarse && narrow ? 'low' : 'standard';
  $('status').hidden = true;
  rebuildSim(true);
  pushUndo();
  setPlaying(!window.__pauseAtBoot);
  setSpeed(1);
  setTool('move');
  updateHint();
  requestAnimationFrame(frame);
})();

window.suiriLab = {
  scene, settings, cam, editor,
  sim: () => sim,
  select, loadPreset: (id) => loadPreset(PRESETS.find((p) => p.id === id), true),
  addItem, resetSim,
  async run(seconds, dt = 1 / 120) {
    setPlaying(false);
    holdRender = true;
    for (let t = 0; t < seconds - 1e-9; t += dt) {
      sim.setObjects(scene.items, dt);
      sim.step(dt, sourceEmits);
      await device.queue.onSubmittedWorkDone();
      sim.pollStats();
    }
    await device.queue.onSubmittedWorkDone();
    sim.pollStats();
    holdRender = !!window.__holdRenderAtBoot;
    await new Promise((r) => setTimeout(r, 50));
    return this.stats();
  },
  async frame() {
    await device.queue.onSubmittedWorkDone();
    updateCamera(RT.w, RT.h);
    drawFrame(sim, drawOverlay);
    await device.queue.onSubmittedWorkDone();
    await new Promise((r) => setTimeout(r, 300));
    return true;
  },
  hold(v) { holdRender = v; },
  async rippleStats() {
    const r = sim.ripple;
    const n = (r.R + 1);
    const bpr = Math.ceil(n * 8 / 256) * 256;
    const buf = device.createBuffer({ size: bpr * n, usage: BU.COPY_DST | BU.MAP_READ });
    const enc = device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: r.tex }, { buffer: buf, bytesPerRow: bpr }, [n, n]);
    device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const u16 = new Uint16Array(buf.getMappedRange());
    const f16 = (h) => { const s = h >> 15, e = (h >> 10) & 31, m = h & 1023; return (s ? -1 : 1) * (e === 0 ? m / 1024 * 2 ** -14 : e === 31 ? Infinity : (1 + m / 1024) * 2 ** (e - 15)); };
    let maxH = 0, maxS = 0, sumS = 0;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const o = (y * bpr) / 2 + x * 4;
      const h = f16(u16[o]), sx = f16(u16[o + 1]), sz = f16(u16[o + 2]);
      maxH = Math.max(maxH, Math.abs(h)); const sl = Math.hypot(sx, sz); maxS = Math.max(maxS, sl); sumS += sl;
    }
    buf.unmap(); buf.destroy();
    return { maxH, maxS, meanS: sumS / (n * n) };
  },
  noRippleMask() { sim.ripple.bg.maskBuild = null; },
  stats: () => ({ frames: frameCount, impacts: sim.impacts, count: sim.count, ww: sim.wwCount, vmax: sim.vmax, time: sim.time, liters: sim.waterLiters, grid: [sim.nx, sim.ny, sim.nz], gpuErrors }),
  noAutoQuality() { perf.checked = true; },
  async idle() { await device.queue.onSubmittedWorkDone(); },
  setPlaying,
};

})();
</script>
</body>
</html>
